<script>
  const ICON_COL = '__Copy';
  const VISIBLE_COLS = [ICON_COL, 'Time', 'Source', 'Policies', 'Channel', 'Destination', 'File Name', 'Size', 'Details', 'Status'];
  const ALL_COLS = ['ID', 'Incident Time', 'Event Time', 'Source', 'Policies', 'Destination', 'File Name', 'Transaction Size (KB)', 'Details', 'Status', 'Channel', 'Action', 'Severity'];
  const FILTERABLE_COLS = ['Time', 'Source', 'Policies', 'Channel', 'Destination', 'File Name', 'Details', 'Status'];

  const HEADER_LABELS = {
    [ICON_COL]: '',
    Time: 'Time',
    Source: 'Source',
    Policies: 'Policies',
    Channel: 'Channel',
    Destination: 'Destination',
    'File Name': 'File Name',
    Size: 'Size (KB)',
    Details: 'Details',
    Status: 'Status'
  };

  const cardTooltips = {
    total: 'Total number of alerts detected',
    sources: 'Unique source accounts/devices observed',
    emaildest: 'Unique email destination domains',
    webdest: 'Unique web destination domains',
    channels: 'Communication channels where alerts were triggered',
    blocks: 'Alerts where action was Block/Quarantine',
    self: 'Suspicious: email sent to self (sender and recipient look similar)',
    freemail: 'Suspicious: recipient uses free mail provider (gmail, yahoo, protonmail, icloud)',
    shortsubj: 'Suspicious: email subject is too short or empty',
    noext: 'Suspicious: attachment has no file extension',
    seqfiles: 'Suspicious: multiple attachments with similar sequential names (e.g. file1, file2, file3)',
    sensitive: 'Suspicious: attachment or subject contains sensitive keywords (confidential, salary, password, etc.)',
    repeatdom: 'Suspicious: same user repeatedly sends to the same destination domain',
    weirdtld: 'Suspicious: destination domain with unusual TLD (.xyz, .top, .icu)',
    outofhours: 'Suspicious: email sent outside normal working hours (12AM–5AM)'
  };

  const state = { raw: [], tabs: [], activeTab: null, tabState: new Map() };
  let currentFilename = '';

  const $ = (sel, el = document) => el.querySelector(sel);
  const $$ = (sel, el = document) => Array.from(el.querySelectorAll(sel));

  // Sets a cookie with max-age and expires (Safari compatible)
  function setCookie(name, value, days = 7) {
    const maxAge = days * 24 * 60 * 60;
    const expires = new Date(Date.now() + maxAge * 1000).toUTCString();
    document.cookie = `${encodeURIComponent(name)}=${encodeURIComponent(value)}; path=/; max-age=${maxAge}; expires=${expires}; SameSite=Lax`;
  }

  // Gets a cookie value by name
  function getCookie(name) {
    const pattern = new RegExp('(?:^|; )' + encodeURIComponent(name) + '=([^;]*)');
    const match = document.cookie.match(pattern);
    return match ? decodeURIComponent(match[1]) : null;
  }

  // Stores a value in a cookie with localStorage as a fallback
  function setSecret(name, value, days = 7) {
    try { setCookie(name, value, days); } catch (_) {}
    try { localStorage.setItem(name, value); } catch (_) {}
  }

  // Gets a value from a cookie or localStorage as a fallback
  function getSecret(name) {
    return getCookie(name) ?? (() => {
      try { return localStorage.getItem(name); } catch (_) { return null; }
    })();
  }

  // Generates a safe key for a DOM ID
  function safeKey(s) {
    try {
      return btoa(unescape(encodeURIComponent(String(s)))).replace(/=+$/, '');
    } catch {
      return String(s).replace(/[^\w-]+/g, '_');
    }
  }

  // Parses a Forcepoint incident time into a Date object
  function parseIncidentTime(s) {
    if (!s) return null;
    try {
      let t = String(s);
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      months.forEach(m => { t = t.replaceAll(m + '.', m); });
      if (t.includes(' GMT')) t = t.split(' GMT')[0];
      const d = new Date(t);
      return isNaN(d) ? null : d;
    } catch { return null; }
  }

  // Formats a Date object as yyyy-mm-dd
  function formatDateShort(d) {
    try { return d.toISOString().slice(0, 10); } catch { return ''; }
  }

  // Normalizes text into a safe single line (without newlines or tabs)
  function sanitizeForPlain(v) {
    return String(v ?? '')
      .replace(/`/g, '\u200B`')
      .replace(/\r?\n|\t/g, ' ')
      .replace(/\s{2,}/g, ' ')
      .trim();
  }

  // Escapes special HTML characters
  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  }

  // Normalizes a value for TSV (removes tabs and newlines)
  function sanitizeForTSV(v) {
    return String(v ?? '')
      .replace(/\r?\n/g, ' ')
      .replace(/\t/g, ' ')
      .replace(/\s{2,}/g, ' ')
      .trim();
  }

  // Generates [key, value] pairs for one data row
  function getRowCells(row) {
    return [
      ['ID', txt(row['ID'])],
      ['Event Time', stripGMT(txt(row['Event Time']))],
      ['Channel', txt(row['Channel'])],
      ['Source/Sender', txt(row['Source'])],
      ['Destination/Recipient', txt(row['Destination'])],
      ['Document information', txt(row['File Name'])],
      ['Details', txt(row['Details'])]
    ];
  }

  // Builds an HTML table for the clipboard (Excel/Office)
  function buildRowClipboardHTML(row) {
    const cells = getRowCells(row);
    const head = `
    <style>
      table.dlp-copy { border-collapse: collapse; font-family: system-ui, Arial, sans-serif; font-size: 13px; }
      .dlp-copy th, .dlp-copy td { border:1px solid #ccc; padding:6px 8px; text-align:left; vertical-align:top; }
      .dlp-copy th { background:#f6f6f6; width:220px; }
    </style>`;
    const rows = cells.map(([k, v]) => `<tr><th>${escapeHtml(k)}</th><td>${escapeHtml(v)}</td></tr>`).join('');
    return `<!doctype html><html><head>${head}</head><body><table class="dlp-copy">${rows}</table></body></html>`;
  }

  // Builds vertical TSV (key<TAB>value) for the clipboard
  function buildRowClipboardTSV(row) {
    const cells = getRowCells(row);
    const lines = cells.map(([k, v]) => `${sanitizeForTSV(k)}\t${sanitizeForTSV(v)}`);
    return lines.join('\n') + '\n';
  }

  // Copies one row to the clipboard as HTML and TSV (with fallback)
  async function copyRowToClipboard(row) {
    const html = buildRowClipboardHTML(row);
    const tsvText = buildRowClipboardTSV(row);
    try {
      if (navigator.clipboard && window.ClipboardItem) {
        const item = new ClipboardItem({
          'text/html': new Blob([html], { type: 'text/html' }),
          'text/plain': new Blob([tsvText], { type: 'text/plain' })
        });
        await navigator.clipboard.write([item]);
        console.log('Copied: HTML table + TSV (vertical).');
      } else if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(tsvText);
        console.log('Copied (fallback): TSV (vertical) as plaintext.');
      } else {
        const ta = document.createElement('textarea');
        ta.value = tsvText;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try {
          document.execCommand('copy');
          console.log('Copied via execCommand (legacy).');
        } finally {
          ta.remove();
        }
      }
    } catch (e) {
      console.error('Copy failed:', e);
    }
  }

  // Converts a value to a plain string
  function txt(v) { return v == null ? '' : String(v); }

  // Removes the " GMT..." portion from a time value
  function stripGMT(s) {
    if (!s) return '';
    const t = String(s);
    return t.includes(' GMT') ? t.split(' GMT')[0] : t;
  }

  // Extracts only the date portion from "date, time"
  function justDate(s) {
    if (!s) return '';
    return s.split(',')[0];
  }

  // Generates time-cell HTML with a tooltip and data ID
  function timeCellHTML(row) {
    const id = txt(row['ID']);
    const incD = escapeHtml(justDate(stripGMT(txt(row['Incident Time']))));
    const tooltip = timeCellPlainText(row);
    return `<a href="#" class="link copy-id" data-id="${id}" title="${escapeHtml(tooltip)}">${incD}</a>`;
  }

  // Truncates a string to a maximum length with an ellipsis
  function clip(str, lim = 120) {
    const s = String(str ?? '');
    return s.length > lim ? s.slice(0, lim - 3) + '...' : s;
  }

  // Builds a plain-text tooltip for time information
  function timeCellPlainText(row) {
    const id = txt(row['ID']);
    const incF = stripGMT(txt(row['Incident Time']));
    const evtF = stripGMT(txt(row['Event Time']));
    return `ID: ${id}\nIncident: ${incF}\nEvent: ${evtF}`;
  }

  // Generates a value-frequency map from an object array for a given key
  function freqMap(arr, key) {
    const m = new Map();
    for (const r of arr) {
      const k = txt(r[key]).trim();
      if (!k) continue;
      m.set(k, (m.get(k) || 0) + 1);
    }
    return m;
  }

  // Ensures all required columns exist in a data row
  function ensureCols(row) {
    const o = {};
    for (const c of ALL_COLS) o[c] = row[c] ?? '';
    return o;
  }

  // Normalizes object headers (trims key names)
  function sanitizeHeaders(row) {
    const clean = {};
    for (const k in row) {
      if (!Object.prototype.hasOwnProperty.call(row, k)) continue;
      if (!k) continue;
      clean[k.trim()] = row[k];
    }
    return clean;
  }

  const IGNORE_FILE_PREFIXES = ['image', 'img_', 'img-', 'image0', 'outlook-', 'signature', 'sign_', 'logo', 'scan', 'screenshot'];
  const IGNORE_PATTERNS = [
    /^att\d{2,}\.(?:png|jpe?g|gif|bmp|tiff?)$/i,
    /^cid:.+/i,
    /^noname(?:\.\w{1,6})?$/i,
    /^image\d*\.(?:png|jpe?g|gif|bmp|tiff?)$/i,
    /^screenshot ?\d*\.(?:png|jpe?g)$/i
  ];

  // Normalizes common whitespace in a string
  function normalizeSpaces(s) {
    return String(s || '')
      .replace(/\u00A0/g, ' ')
      .replace(/[\u200B-\u200D\uFEFF]/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  // Splits a semicolon-delimited list intelligently (ignores delimiters inside () or [])
  function smartSplit(listStr) {
    const s = String(listStr || '');
    const out = [];
    let buf = '';
    let paren = 0, bracket = 0;
    for (let i = 0; i < s.length; i++) {
      const ch = s[i];
      if (ch === '(') paren++;
      else if (ch === ')') paren = Math.max(0, paren - 1);
      else if (ch === '[') bracket++;
      else if (ch === ']') bracket = Math.max(0, bracket - 1);
      if (ch === ';' && paren === 0 && bracket === 0) {
        out.push(buf);
        buf = '';
      } else {
        buf += ch;
      }
    }
    if (buf) out.push(buf);
    return out.flatMap(t => String(t).split(/\r?\n/));
  }

  // Removes a file-size suffix from a token
  function stripSizeSuffix(s) {
    return normalizeSpaces(s)
      .replace(/\s*[-,]?\s*\(?\s*\[?\s*\d+(?:[\.,]\d+)?\s*(?:[KMGT]B)\s*\]?\s*\)?\s*$/i, '')
      .trim();
  }

  // Checks whether a token has a file extension
  function hasExtension(token) {
    return /\.[A-Za-z0-9]{1,8}$/.test(token);
  }

  // Gets the core name (without an extension)
  function coreName(token) {
    const dot = token.lastIndexOf('.');
    return dot > 0 ? token.slice(0, dot) : token;
  }

  // Determines whether a core name should be ignored (common noisy prefixes)
  function shouldIgnoreCore(core) {
    const lc = core.toLowerCase();
    return IGNORE_FILE_PREFIXES.some(p => lc.startsWith(p));
  }

  // Determines whether a filename token should be ignored (noise)
  function shouldIgnoreToken(token) {
    const t = normalizeSpaces(token);
    if (!t) return true;
    if (!hasExtension(t) && t.length <= 2) return true;
    if (IGNORE_PATTERNS.some(rx => rx.test(t))) return true;
    if (/^(?:attachment|attached)$/i.test(t)) return true;
    const core = coreName(t);
    if (shouldIgnoreCore(core)) return true;
    return false;
  }

  // Normalizes a filename list: split, clean, filter noise, deduplicate, and join
  function normalizeFileList(fileNameCell) {
    const seen = new Set();
    const cleaned = smartSplit(fileNameCell)
      .map(t => normalizeSpaces(t.replace(/^["']|["']$/g, '')))
      .filter(Boolean)
      .map(stripSizeSuffix)
      .map(t => t.replace(/\s+\.\s+/g, '.'))
      .filter(Boolean)
      .filter(t => !shouldIgnoreToken(t))
      .filter(t => {
        const key = t.toLowerCase();
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    return cleaned.join('; ');
  }

  const COMMON_PSL = new Set([
    'co.uk', 'org.uk', 'gov.uk', 'ac.uk',
    'co.jp', 'ne.jp', 'or.jp',
    'com.au', 'net.au', 'org.au',
    'com.sg', 'com.my',
    'co.id', 'or.id',
    'com.ph', 'net.ph', 'org.ph', 'gov.ph', 'edu.ph',
    'com.hk', 'net.hk', 'org.hk', 'edu.hk', 'gov.hk'
  ]);

// Gets the base domain from an email or host, accounting for common public suffixes.
function getBaseDomain(emailOrHost){
  if(!emailOrHost) return '';
  let host = String(emailOrHost);
  const atIx = host.lastIndexOf('@');
  if(atIx>=0) host = host.slice(atIx+1);
  if(host.includes(':')) host = host.split(':')[0];
  if(host.includes('?')) host = host.split('?')[0];
  const parts = host.split('.').filter(Boolean);
  if(parts.length <= 2) return host.toLowerCase();
  const last2 = parts.slice(-2).join('.').toLowerCase();
  if (COMMON_PSL.has(last2)) return parts.slice(-3).join('.').toLowerCase();
  return last2;
}

// Splits a destination string into clean tokens (separated by ; and ,).
function splitDestParts(dest){
  return String(dest || '')
    .split(';').map(x => x.split(','))
    .flat()
    .map(s => s.trim())
    .filter(Boolean);
}

// Checks whether a string resembles a basic email address.
function isEmailLike(s){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(s));
}

// Freezes an object (to a limited depth) to prevent modification.
function deepFreeze(obj, maxDepth = 3, _seen = new WeakSet()) {
  if (!obj || typeof obj !== 'object' || _seen.has(obj)) return obj;
  _seen.add(obj);
  Object.freeze(obj);
  if (maxDepth <= 0) return obj;
  for (const k of Object.keys(obj)) {
    try { deepFreeze(obj[k], maxDepth - 1, _seen); } catch {}
  }
  return obj;
}

// Compiles user code into a safe predicate with a sandbox and API allowlist.
function secureCompilePredicate(userCode, asExpressionFirst = true) {
  const SAFE_GLOBALS = {
    Math, Number, String, Boolean, RegExp, JSON, Date, Array, Object,
    isFinite, isNaN, parseInt, parseFloat, encodeURI, decodeURI,
    encodeURIComponent, decodeURIComponent
  };

  const FORBIDDEN_TOKENS =
    /(^|[^\w$])(window|document|eval|arguments|Function|fetch|XMLHttpRequest|WebSocket|EventSource|postMessage|localStorage|sessionStorage|indexedDB|location|navigator|history|top|parent|opener)([^\w$]|$)/;

  const bad = userCode.match(FORBIDDEN_TOKENS);
  if (bad) {
    console.error("❌ Forbidden token detected:", bad[2], "in user code:", userCode);
    throw new Error("Forbidden token found: " + bad[2]);
  }

  try {
    for (const k of Object.keys(SAFE_GLOBALS)) Object.freeze(SAFE_GLOBALS[k]);
  } catch {}

  const KILL_GLOBALS = `
    const globalThis = undefined, window = undefined, self = undefined, frames = undefined, parent = undefined, top = undefined, opener = undefined;
    const document = undefined, alert = undefined, confirm = undefined, prompt = undefined;
    const Function = undefined, fetch = undefined, XMLHttpRequest = undefined, WebSocket = undefined, EventSource = undefined, postMessage = undefined;
    const requestAnimationFrame = undefined, setTimeout = undefined, setInterval = undefined, setImmediate = undefined, queueMicrotask = undefined;
    const localStorage = undefined, sessionStorage = undefined, indexedDB = undefined, location = undefined, navigator = undefined, history = undefined;
  `;

  const build = (body) => {
    const src = `"use strict";
      ${KILL_GLOBALS}
      const { Math, Number, String, Boolean, RegExp, JSON, Date, Array, Object,
              isFinite, isNaN, parseInt, parseFloat, encodeURI, decodeURI,
              encodeURIComponent, decodeURIComponent } = SAFE;
      ${body}`;
    return new Function('row', 'rows', 'i', 'SAFE', src);
  };

  if (asExpressionFirst) {
    try {
      return build('return !!(' + userCode + ');');
    } catch (e) {
      console.warn("⚠️ Expression compile failed, fallback to statement mode:", e);
    }
  }

  return build(String(userCode || 'return false;'));
}

// Converts and appends data rows to state, then updates tabs and the incident range.
function ingest(rows){
  // Append rows so files from one upload action are combined
  const mapped = rows.map(r => {
    const row = ensureCols(sanitizeHeaders(r));
    row['File Name'] = normalizeFileList(row['File Name']);
    row.IncidentTime = row['Incident Time'];
    row.EventTime    = row['Event Time'];
    row.FileName     = row['File Name'];
    row.Size         = row['Transaction Size (KB)'];
    return row;
  });

  if (!Array.isArray(state.raw)) state.raw = [];
  state.raw.push(...mapped);

  buildTabs();
  updateIncidentRange();
}

// Builds tab definitions from the dataset (overview, custom, blocked, per-channel, and saved tabs).
function buildTabs(){
  const all = state.raw;

  const isBlocked = r => {
    const a = txt(r['Action']).toLowerCase();
    return a.includes('block') || a.includes('quarantine');
  };

  const blocks  = all.filter(isBlocked);
  const normals = all.filter(r => !isBlocked(r));

  const byCh = new Map();
  for(const r of normals){
    const ch = txt(r['Channel']).trim() || '(Empty Channel)';
    if(!byCh.has(ch)) byCh.set(ch, []);
    byCh.get(ch).push(r);
  }

  const closables = state.tabs.filter(t=> t.closable);
  state.tabs = [];
  state.tabs.push({key:'overview', label:'Overview', type:'overview', rows: all});
  state.tabs.push({key:'custom', label:'Custom JS', type:'custom', rows: all});

  if(blocks.length) state.tabs.push({key:'block', label:`Action: Block (${blocks.length})`, type:'block', rows: blocks});

  Array.from(byCh.entries()).sort((a,b)=> b[1].length - a[1].length).forEach(([ch,rows])=>{
    state.tabs.push({key:`ch::${ch}`, label:`${ch} (${rows.length})`, type:'channel', rows});
  });

  for (const t of closables){
    const refiltered = t.filter ? applyDrillFilter(all, t.filter) : t.rows;
    state.tabs.push({ ...t, rows: refiltered });
  }

  if(!state.activeTab) state.activeTab = 'overview';
  renderTabs();
}

// Renders tab buttons and click handlers, then renders the active tab and filter icons.
function renderTabs(){
  const tabsEl = $('#tabs'); tabsEl.innerHTML = '';
  for(const t of state.tabs){
    const b = document.createElement('button');
    b.className = 'tab-btn';
    b.setAttribute('role','tab');
    b.setAttribute('aria-selected', String(state.activeTab===t.key));
    const labelSpan = document.createElement('span');
    labelSpan.textContent = t.label;
    b.appendChild(labelSpan);

    if(t.closable){
      const close = document.createElement('span');
      close.className = 'tab-close';
      close.textContent = '✕';
      close.title = 'Close tab';
      close.addEventListener('click', (e)=>{
        e.stopPropagation();
        const idx = state.tabs.findIndex(x=>x.key===t.key);
        if(idx>=0){
          const wasActive = state.activeTab===t.key;
          state.tabs.splice(idx,1);
          state.tabState.delete(t.key);
          if(wasActive){
            const prev = state.tabs[Math.max(0, idx-1)];
            state.activeTab = prev ? prev.key : 'overview';
          }
          renderTabs();
        }
      });
      b.appendChild(close);
    }

    b.addEventListener('click', ()=>{
      state.activeTab = t.key;
      renderTabs();
    });

    tabsEl.appendChild(b);
  }
  renderActiveTab();
  const active = state.tabs.find(t => t.key === state.activeTab);
  if (active && typeof updateFilterIcons === 'function') {
    updateFilterIcons(active, $('#panels'));
  }
}

// Returns or initializes per-tab state (filters, pagination, and sorting).
function getTabState(key){
  if(!state.tabState.has(key)) state.tabState.set(key, {filters:{}, page:1, pageSize:50, sort:null});
  return state.tabState.get(key);
}

// Renders content for the active tab and synchronizes filter icons.
function renderActiveTab(){
  const panels = $('#panels'); panels.innerHTML = '';
  const tab = state.tabs.find(t=> t.key===state.activeTab);
  if(!tab){
    panels.innerHTML = '<div class="muted">No data. Upload a CSV to get started.</div>';
    return;
  }

  let el;
  if(tab.type==='overview') el = renderOverview(tab.rows);
  else if(tab.type==='custom') el = renderCustomTab(tab);
  else el = renderTableSection(tab);

  if (el && el.setAttribute) el.setAttribute('data-tab', tab.key);
  panels.appendChild(el);

  if (typeof updateFilterIcons === 'function') {
    updateFilterIcons(tab, el || panels);
  }
}

// Calls the OpenAI API to generate a JavaScript predicate from a user prompt.
async function runChatbot(prompt){
  const preprompt = `
Write a JavaScript predicate for the “Custom JS” tab.
The code is executed for each data row and must return a boolean.

Execution environment:
- Full dataset: rows (Array<Row>)
- Current row: row (Object), its index i (Number)

Constraints:
- Use pure JavaScript.
- Do not use fetch, DOM, window, globalThis, Function, eval, storage APIs, or external libraries.
- You may use rows and i for cross-row logic, but the final result must still be a boolean for the current row.
- Data separator is semicolon (;), e.g., "contract_2025.pdf; image.png"

Available fields (camelCase, case-sensitive) + examples:
row.ID → "70100001"
row.IncidentTime → "25 Aug. 2025, 09:01:00 AM GMT+0800"
row.EventTime → "25 Aug. 2025, 08:59:12 AM GMT+0800"
row.FileName → "contract_2025.pdf; image.png" (if more than one, separated by semicolon)

// Runs a predicate over rows in chunks to keep the UI responsive.
async function computeRuleMatchesChunked(rows, predicate, onProgress, CHUNK_SIZE = 600){
  const matches = [];
  for (let i = 0; i < rows.length; i += CHUNK_SIZE) {
    const slice = rows.slice(i, i + CHUNK_SIZE);

    for (const r of slice) {
      try {
        if (predicate(r)) matches.push(r);
      } catch (e) {
        console.error('Rule eval error:', e);
      }
    }

    if (onProgress) onProgress(matches.length, Math.min(i + CHUNK_SIZE, rows.length), rows.length);
    await new Promise(r => setTimeout(r, 0));
  }
  return matches;
}

// Binds click handlers once to metric/rule cards to open ad hoc tabs.
function bindCardsClickOnce(cards, metricData, ruleDefs, rows){
  if (cards.__boundClick) return;
  cards.__boundClick = true;

  cards.addEventListener('click', async (e) => {
    const a = e.target.closest('a.metric');
    if (!a) return;
    e.preventDefault();
    e.stopPropagation();

    const mkey = a.getAttribute('data-metric');
    if (mkey) {
      const label = metricData.labels[mkey] || 'Items';
      const dataset = metricData.data[mkey] || [];
      openAdHocTab(label, dataset);
      return;
    }

    const rkey = a.getAttribute('data-rule');
    if (rkey) {
      const def = ruleDefs.find(x => x.key === rkey);
      if (!def) return;

      if (!a.__matches) {
        const b = a.closest('b');
        const old = a.innerHTML;
        a.innerHTML = `<span class="spin" aria-label="Loading"></span>`;
        const matches = await computeRuleMatchesChunked(rows, def.fn);
        a.__matches = matches;
        a.textContent = matches.length;
      }
      openAdHocTab(`${def.label} (${a.__matches.length})`, a.__matches);
    }
  });
}

// Creates a lightweight dataset hash for caching rule results.
function computeDatasetHash(rows){
  const keysrc = rows.slice(0, 50).map(r => `${txt(r['ID'])}|${txt(r['Incident Time'])}`).join('||');
  let h = 5381;
  for (let i = 0; i < keysrc.length; i++) h = ((h << 5) + h) ^ keysrc.charCodeAt(i);
  h = (h >>> 0).toString(36);
  return `${rows.length}_${h}`;
}

const RULE_CACHE_VERSION = 1;
const CACHE_NS = 'dlp_rules_';
const STORE   = sessionStorage;

// Loads cached rule results from sessionStorage.
function loadRuleCache(hash){
  try{
    const raw = STORE.getItem(`${CACHE_NS}${hash}`);
    return raw ? JSON.parse(raw) : null;
  }catch{ return null; }
}

// Stores cached rule results in sessionStorage (with cleanup fallback).
function saveRuleCache(hash, data){
  try{
    STORE.setItem(`${CACHE_NS}${hash}`, JSON.stringify(data));
  }catch{
    clearRuleCaches();
  }
}

// Removes all rule-cache entries from sessionStorage.
function clearRuleCaches(){
  try{
    Object.keys(STORE).forEach(k=>{
      if (k.startsWith(CACHE_NS)) STORE.removeItem(k);
    });
  }catch{}
}

// Generates a stable composite ID for a row (avoids collisions across files).
function getRowId(r){
  // Composite ID to remain safe across multiple files
  const id   = txt(r['ID']).trim();
  const incT = stripGMT(txt(r['Incident Time'])).trim();
  const evT  = stripGMT(txt(r['Event Time'])).trim();
  const src  = txt(r['Source']).trim();

  if (id || incT) return `${id}|${incT}`;
  if (id || evT)  return `${id}|${evT}`;
  if (src && incT) return `${src}|${incT}`;

  // Fallback terakhir
  return JSON.stringify({
    id, incT, evT, src, fn: txt(r['File Name']).slice(0,80)
  });
}

// Builds a Map index from row IDs to array indices.
function indexRowsById(rows){
  const m = new Map();
  rows.forEach((r, i) => m.set(getRowId(r), i));
  return m;
}

// Extracts the first valid email address from a string.
function extractFirstEmail(s){
  const str = String(s || '');
  if (isEmailLike(str)) return str;
  const m = str.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i);
  return m ? m[0] : '';
}

// Extracts and normalizes the email local part.
function extractLocal(email){
  if (!email) return '';
  const ix = email.indexOf('@');
  if (ix < 1) return '';
  let local = email.slice(0, ix).toLowerCase();
  const plus = local.indexOf('+');
  if (plus >= 0) local = local.slice(0, plus);
  local = local.replace(/[\s._-]+/g, '');
  return local;
}

// Calculates the common-prefix length of two strings.
function commonPrefixLen(a, b){
  const n = Math.min(a.length, b.length);
  let i = 0;
  while (i < n && a[i] === b[i]) i++;
  return i;
}

// Calculates Levenshtein distance with an early-exit threshold.
function levenshtein(a, b, maxDist = 3){
  const n = a.length, m = b.length;
  if (Math.abs(n - m) > maxDist) return maxDist + 1;
  if (n > m) { const tmp = a; a = b; b = tmp; }
  const v0 = new Uint16Array(b.length + 1);
  const v1 = new Uint16Array(b.length + 1);
  for (let j = 0; j <= b.length; j++) v0[j] = j;
  let minInRow;
  for (let i = 0; i < a.length; i++){
    v1[0] = i + 1;
    minInRow = v1[0];
    for (let j = 0; j < b.length; j++){
      const cost = a[i] === b[j] ? 0 : 1;
      const del  = v0[j + 1] + 1;
      const ins  = v1[j] + 1;
      const sub  = v0[j] + cost;
      const val  = Math.min(del, ins, sub);
      v1[j + 1] = val;
      if (val < minInRow) minInRow = val;
    }
    if (minInRow > maxDist) return maxDist + 1;
    for (let j = 0; j <= b.length; j++) v0[j] = v1[j];
  }
  return v0[b.length];
}

// Calculates the Jaro-Winkler similarity score.
function jaroWinkler(s1, s2){
  // Calculates matching pairs and transpositions for Jaro.
  function jaroMatch(a, b){
    const matchDist = Math.floor(Math.max(a.length, b.length) / 2) - 1;
    const aFlags = new Array(a.length).fill(false);
    const bFlags = new Array(b.length).fill(false);
    let matches = 0;
    for (let i = 0; i < a.length; i++){
      const start = Math.max(0, i - matchDist);
      const end = Math.min(i + matchDist + 1, b.length);
      for (let j = start; j < end; j++){
        if (bFlags[j]) continue;
        if (a[i] !== b[j]) continue;
        aFlags[i] = true; bFlags[j] = true;
        matches++;
        break;
      }
    }
    if (!matches) return { matched: 0, transpositions: 0 };
    let k = 0, transpositions = 0;
    for (let i = 0; i < a.length; i++){
      if (!aFlags[i]) continue;
      while (!bFlags[k]) k++;
      if (a[i] !== b[k]) transpositions++;
      k++;
    }
    return { matched: matches, transpositions };
  }

  const m = jaroMatch(s1, s2);
  if (m.matched === 0) return 0;
  const jaro = (m.matched / s1.length + m.matched / s2.length + (m.matched - m.transpositions / 2) / m.matched) / 3;
  let l = 0;
  while (l < 4 && l < s1.length && l < s2.length && s1[l] === s2[l]) l++;
  return jaro + l * 0.1 * (1 - jaro);
}

// Evaluates sender and recipient local-part similarity (self-like).
function isSelfLike(fromEmail, toEmail, {useJaroWinkler = true} = {}){
  const a = extractLocal(fromEmail);
  const b = extractLocal(toEmail);
  if (!a || !b) return false;
  const pref = commonPrefixLen(a, b);
  const minLen = Math.min(a.length, b.length);
  const prefixOK = pref >= 5 || pref >= Math.ceil(minLen * 0.6);
  const maxLen = Math.max(a.length, b.length);
  const lev = levenshtein(a, b, 3);
  const levOK = (maxLen >= 6 && lev <= 2) || (minLen <= 5 && lev <= 1);
  if (prefixOK || levOK) return true;
  if (useJaroWinkler){
    const jw = jaroWinkler(a, b);
    if (jw >= 0.88) return true;
  }
  return false;
}

// Rule: true when a recipient resembles the sender.
function ruleSelfToSelf(r){
  const srcEmail = extractFirstEmail(txt(r['Source']));
  if (!srcEmail) return false;
  const destParts = splitDestParts(txt(r['Destination']));
  for (const d of destParts){
    if (!isEmailLike(d)) continue;
    if (isSelfLike(srcEmail, d, {useJaroWinkler: true})) return true;
  }
  return false;
}

// Rule: true when a recipient domain is a free email provider.
function ruleRecipientFreeMail(r){
  return splitDestParts(r['Destination']).some(d=>{
    const dom = getBaseDomain(d);
    return ['gmail.com','yahoo.com','protonmail.com','proton.me','icloud.com'].includes(dom);
  });
}

// Rule: true when the email subject is empty or below the minimum length.
function ruleShortOrEmptySubject(r, minLen = 10){
  const ch = txt(r['Channel']).toLowerCase();
  if (!ch.includes('email')) return false;
  const s = txt(r['Details']).trim();
  return s.length === 0 || s.length < minLen;
}

// Rule: true when an attachment has no extension.
function ruleAttachmentNoExtension(r){
  return txt(r['File Name']).split(';').some(f=>{
    const fn = f.trim();
    return fn && !fn.includes('.');
  });
}

// Extracts a normalized filename core for sequence detection.
function filenameCoreStrict(s){
  let t = stripSizeSuffix(s || '').trim();
  if (!t) return '';
  const dot = t.lastIndexOf('.');
  t = (dot > 0 ? t.slice(0, dot) : t).toLowerCase();
  if (shouldIgnoreCore(t)) return '';
  t = t
    .replace(/[_\-\s]*\((?:copy|\d+)\)\s*$/i, '')
    .replace(/[_\-\s]*v\d{1,3}\s*$/i, '')
    .replace(/[_\-\s]*(?:copy|final|signed)\s*$/i, '')
    .replace(/[_\-\s]*\d{1,4}\s*$/i, '');
  t = t.replace(/[^a-z0-9]+/g, ' ').trim();
  if (t.length < 3) return '';
  return t;
}

// Derives a list of unique filename cores from a cell.
function fileCoresFromCell(cell){
  const cores = String(cell || '')
    .split(/[;,]/)
    .map(s => s.trim())
    .filter(Boolean)
    .map(filenameCoreStrict)
    .filter(Boolean);
  return Array.from(new Set(cores));
}

// Extracts the stem and trailing number from a filename.
function extractStemTail(name){
  const raw = stripSizeSuffix(name || '').trim();
  if (!raw) return null;
  const dot = raw.lastIndexOf('.');
  const base = dot > 0 ? raw.slice(0, dot) : raw;
  const m = base.match(/^(.*?)[\s._-]*\(?\s*(\d{1,4})\s*\)?\s*$/);
  if (!m) {
    const stemOnly = base.trim().toLowerCase();
    if (!stemOnly || shouldIgnoreCore(stemOnly)) return null;
    return { stem: stemOnly, tail: null };
  }
  let stem = (m[1] || '').trim().toLowerCase();
  const tail = m[2] ? parseInt(m[2], 10) : null;
  if (!stem || shouldIgnoreCore(stem)) return null;
  return { stem, tail };
}

// Builds a stem-to-numeric-tail-set index for each source.
function buildSequentialIndex(rows){
  // Support ;, newline, and , separators for multiple filenames
  const idx = new Map();
  for (const r of rows){
    const src = txt(r['Source']).trim().toLowerCase();
    if (!src) continue;

    const tokens = txt(r['File Name'])
      .split(/;|\n|,/)    // ← tambahan dukung koma
      .map(t => t.trim())
      .filter(Boolean);

    for (const t of tokens){
      const part = extractStemTail(t);
      if (!part || part.tail == null) continue;

      if (!idx.has(src)) idx.set(src, new Map());
      const m = idx.get(src);
      if (!m.has(part.stem)) m.set(part.stem, new Set());
      m.get(part.stem).add(part.tail);
    }
  }
  return idx;
}

// Gets hot stems (unique tails ≥ threshold) for each source.
function getHotStemsBySource(idx, threshold = 5){
  const hot = new Map();
  for (const [src, mapStem] of idx){
    for (const [stem, tails] of mapStem){
      if (tails.size >= threshold){
        if (!hot.has(src)) hot.set(src, new Set());
        hot.get(src).add(stem);
      }
    }
  }
  return hot;
}

// Rule: true when a row has an attachment with a hot stem for its source.
function ruleSequentialAttachments(r, hotBySrc){
  const src = txt(r['Source']).trim().toLowerCase();
  if (!src) return false;
  const hot = hotBySrc.get(src);
  if (!hot || hot.size === 0) return false;
  const tokens = txt(r['File Name'])
    .split(/;|\n|,/)
    .map(t => t.trim())
    .filter(Boolean);
  for (const t of tokens){
    const part = extractStemTail(t);
    if (!part) continue;
    const stem = (part.stem || '').toLowerCase();
    if (stem && hot.has(stem)) return true;
  }
  return false;
}

const SENSITIVE_KEYWORDS = [
  'confidential',
  'salary',
  'client[_\\s-]?list',
  'password',
  'secret',
  'api[_\\s-]?key',
  'credit[_\\s-]?card'
];

const sensitiveRegex = new RegExp("\\b(" + SENSITIVE_KEYWORDS.join("|") + ")\\b", "i");

// Rule: true when sensitive keywords appear in the subject, filename, or policies.
function ruleSensitiveKeywords(r){
  return sensitiveRegex.test(txt(r['Details'])) ||
         sensitiveRegex.test(txt(r['File Name'])) ||
         sensitiveRegex.test(txt(r['Policies']));
}

// Calculates destination-domain frequency per sender.
function buildSenderDomainCounts(rows){
  const m = new Map();
  for(const r of rows){
    const src = txt(r['Source']).trim().toLowerCase();
    if(!src) continue;
    const parts = splitDestParts(r['Destination']);
    for(const p of parts){
      const dom = getBaseDomain(p);
      if(!dom) continue;
      const key = `${src}|${dom.toLowerCase()}`;
      m.set(key, (m.get(key) || 0) + 1);
    }
  }
  return m;
}

// Rule: true when a sender repeatedly sends to the same domain above the threshold.
function ruleRepeatedDomainBySender(r, countsMap, threshold = 5){
  const src = txt(r['Source']).trim().toLowerCase();
  if(!src) return false;
  const parts = splitDestParts(r['Destination']);
  for(const p of parts){
    const dom = getBaseDomain(p);
    if(!dom) continue;
    const key = `${src}|${dom.toLowerCase()}`;
    if((countsMap.get(key) || 0) > threshold) return true;
  }
  return false;
}

// Rule: true when the destination domain uses an unusual TLD (xyz/top/icu).
function ruleWeirdTLD(r){
  const dom = getBaseDomain(txt(r['Destination']));
  return dom && /\.(xyz|top|icu)$/i.test(dom);
}

// Rule: true when an incident occurs between 00:00 and 04:59.
function ruleOutOfHours(r){
  const d = parseIncidentTime(r['Incident Time']);
  if(!d) return false;
  const h = d.getHours();
  return h>=0 && h<5;
}

// Aggregates row counts by unique destination domain (based on base domain).
function aggregateDomains(rows){
  const m = new Map();
  for(const r of rows){
    const dest = txt(r['Destination']);
    const semi = dest.split(';');
    const parts = semi.map(x=> x.split(',')).flat().map(s=> s.trim()).filter(Boolean);
    const bases = parts.map(getBaseDomain).filter(Boolean);
    const uniq = Array.from(new Set(bases));
    for(const b of uniq){ m.set(b, (m.get(b)||0)+1); }
  }
  return Array.from(m.entries()).sort((a,b)=> b[1]-a[1]);
}

// Aggregates alert counts by day (based on Incident Time, ISO yyyy-mm-dd).
function aggregateByDay(rows){
  const m = new Map();
  for(const r of rows){
    const d = parseIncidentTime(r['Incident Time']); if(!d) continue;
    const key = d.toISOString().slice(0,10);
    m.set(key, (m.get(key)||0)+1);
  }
  return Array.from(m.entries()).sort((a,b)=> a[0].localeCompare(b[0]));
}

// Draws a responsive SVG line chart with axes, grid, and interactive tooltips.
function makeLineChart(pairs){
  const dates=pairs.map(p=>p[0]), values=pairs.map(p=>p[1]);
  const w=Math.max(600, document.querySelector('.wrap').clientWidth - 40);
  const h=220, pl=48, pr=12, pt=12, pb=28;
  const max=Math.max(1,...values), min=0;
  const x = (i)=> pl + (w-pl-pr) * (i/Math.max(1,values.length-1));
  const y = (v)=> h - pb - (h-pt-pb)*((v-min)/(max-min||1));
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'); svg.setAttribute('viewBox',`0 0 ${w} ${h}`); svg.style.width='100%';

  const ax=document.createElementNS(svg.namespaceURI,'line'); ax.setAttribute('x1',pl); ax.setAttribute('y1',h-pb); ax.setAttribute('x2',w-pr); ax.setAttribute('y2',h-pb); ax.setAttribute('stroke','#2b3d55'); svg.appendChild(ax);
  const ay=document.createElementNS(svg.namespaceURI,'line'); ay.setAttribute('x1',pl); ay.setAttribute('y1',pt); ay.setAttribute('x2',pl); ay.setAttribute('y2',h-pb); ay.setAttribute('stroke','#2b3d55'); svg.appendChild(ay);

  const ticks=5;
  for(let i=0;i<=ticks;i++){
    const v=min+(max-min)*i/ticks, ty=y(v);
    const gl=document.createElementNS(svg.namespaceURI,'line'); gl.setAttribute('x1',pl); gl.setAttribute('x2',w-pr); gl.setAttribute('y1',ty); gl.setAttribute('y2',ty); gl.setAttribute('stroke','#1d2633'); gl.setAttribute('stroke-dasharray','2,4'); svg.appendChild(gl);
    const label=document.createElementNS(svg.namespaceURI,'text'); label.setAttribute('x',pl-6); label.setAttribute('y',ty+4); label.setAttribute('text-anchor','end'); label.setAttribute('fill','#8aa0b5'); label.setAttribute('font-size','12'); label.textContent=Math.round(v); svg.appendChild(label);
  }

  const step=Math.ceil(dates.length/12)||1;
  for(let i=0;i<dates.length;i+=step){
    const tx=x(i);
    const label=document.createElementNS(svg.namespaceURI,'text'); label.setAttribute('x',tx); label.setAttribute('y',h-8); label.setAttribute('text-anchor','middle'); label.setAttribute('fill','#8aa0b5'); label.setAttribute('font-size','12'); label.textContent=dates[i]; svg.appendChild(label);
  }

  const poly=document.createElementNS(svg.namespaceURI,'polyline'); poly.setAttribute('points', values.map((v,i)=>`${x(i)},${y(v)}`).join(' ')); poly.setAttribute('fill','none'); poly.setAttribute('stroke','currentColor'); poly.setAttribute('stroke-width','2'); svg.appendChild(poly);

  const dot=document.createElementNS(svg.namespaceURI,'circle'); dot.setAttribute('r','4'); dot.setAttribute('fill','currentColor'); dot.style.display='none'; svg.appendChild(dot);
  const tooltip=document.createElement('div'); tooltip.className='tooltip'; document.body.appendChild(tooltip);
  const hit=document.createElementNS(svg.namespaceURI,'rect'); hit.setAttribute('x',pl); hit.setAttribute('y',pt); hit.setAttribute('width',w-pl-pr); hit.setAttribute('height',h-pt-pb); hit.setAttribute('fill','transparent'); svg.appendChild(hit);

  hit.addEventListener('mousemove', (e)=>{
    const rect=svg.getBoundingClientRect(); const px=e.clientX-rect.left;
    const t=Math.max(0, Math.min(1,(px-pl)/(w-pl-pr))); const i=Math.round(t*(values.length-1));
    const cx=x(i), cy=y(values[i]); dot.setAttribute('cx',cx); dot.setAttribute('cy',cy); dot.style.display='';
    tooltip.style.display='block'; tooltip.textContent=`${dates[i]} • ${values[i]} alerts`;
    tooltip.style.left=(rect.left+window.scrollX+cx+12)+'px'; tooltip.style.top=(rect.top+window.scrollY+cy-10)+'px';
  });
  hit.addEventListener('mouseleave', ()=>{ dot.style.display='none'; tooltip.style.display='none'; });
  return svg;
}

        };

    } catch (e) {

    }

    const allRows = tab.rows || state.raw;
    const BATCH = 800;
    const out = [];
    const t0 = performance.now();
    statusEl.textContent = `Running... 0 / ${allRows.length}`;

      Math, Number, String, Boolean, RegExp, JSON, Date, Array, Object,

    };
    const frozenRows = deepFreeze(allRows.map(r => Object.freeze({...r})));

    try {
      for (let start = 0; start < allRows.length; start += BATCH) {
        const end = Math.min(start + BATCH, allRows.length);
        for (let i = start; i < end; i++) {
          const rowClone = deepFreeze({ ...allRows[i] });

            ok = !!pred(rowClone, frozenRows, i, SAFE);
          } catch (_) { ok = false; }
          if (ok) out.push(allRows[i]);
        }
        statusEl.textContent = `Running... ${end} / ${allRows.length}`;

      }
    } catch (e) {

      return;
    }

    const dt = Math.round(performance.now() - t0);
    statusEl.textContent = `Done. Matched ${out.length} / ${allRows.length} rows in ${dt} ms`;

  }

      body: JSON.stringify({

        temperature: 1,
        messages: [
          { role: 'system', content: PREPROMPT },
          { role: 'user', content: task }
        ]
      })
    });

    if (!resp.ok) {
      let msg = `HTTP ${resp.status}`;
      try { const err = await resp.json(); if (err?.error?.message) msg += `: ${err.error.message}`; } catch(_) {}
      throw new Error(msg);
    }

    const data = await resp.json();
    const content = data?.choices?.[0]?.message?.content || '';
    return extractJS(content);

}

		</svg>`;

        });

        a.className = 'link copy-cell';
        a.textContent = shown;
        a.title = full;
        a.dataset.value = full;
        a.addEventListener('click',(e)=>{
          e.preventDefault();
          if (full) {
            navigator.clipboard.writeText(full).then(()=>{
              console.log(`${col} "${full}" copied`);

// Applies filtering and sorting to a row array and returns the result.
function applyFiltersAndSort(rows, filters, sort){
  let out = rows.slice();
  for(const k of Object.keys(filters||{})){
    const needle = (filters[k]||'').toLowerCase();
    if(k==='Time'){
      out = out.filter(r=>{
        const comp = `ID ${txt(r['ID'])} Incident ${txt(r['Incident Time'])} Event ${txt(r['Event Time'])}`.toLowerCase();
        return comp.includes(needle);
      });
    } else {
      out = out.filter(r=> txt(r[k]).toLowerCase().includes(needle));
    }
  }
  const byFreq = (col)=>{
    const m = new Map();
    for(const r of out){
      const key = (col==='Time')
        ? `ID ${txt(r['ID'])} Incident ${txt(r['Incident Time'])} Event ${txt(r['Event Time'])}`
        : txt(r[col]).trim();
      if(!key) continue;
      m.set(key, (m.get(key)||0)+1);
    }
    return m;
  };
  if (sort && sort.col){
    const col = sort.col;
    if (sort.type === 'asc' || sort.type === 'desc'){
      if (col === 'Time'){
        out.sort((a,b)=>{
          const at=parseIncidentTime(a['Incident Time']);
          const bt=parseIncidentTime(b['Incident Time']);
          const cmp = (at?at.getTime():-Infinity) - (bt?bt.getTime():-Infinity);
          return sort.type === 'asc' ? cmp : -cmp;
        });
      } else {
        out.sort((a,b)=>{
          const av = txt(a[col]).toLowerCase();
          const bv = txt(b[col]).toLowerCase();
          const cmp = av.localeCompare(bv, undefined, {numeric:true,sensitivity:'base'});
          if (cmp !== 0) return sort.type === 'asc' ? cmp : -cmp;
          const at=parseIncidentTime(a['Incident Time']); const bt=parseIncidentTime(b['Incident Time']);
          return (bt?bt.getTime():-Infinity) - (at?at.getTime():-Infinity);
        });
      }
    } else if (sort.type === 'most' || sort.type === 'less'){
      const freq = byFreq(col);
      out.sort((a,b)=>{
        const ak = (col==='Time')
          ? `ID ${txt(a['ID'])} Incident ${txt(a['Incident Time'])} Event ${txt(a['Event Time'])}`
          : txt(a[col]).trim();
        const bk = (col==='Time')
          ? `ID ${txt(b['ID'])} Incident ${txt(b['Incident Time'])} Event ${txt(b['Event Time'])}`
          : txt(b[col]).trim();
        const af = freq.get(ak)||0, bf = freq.get(bk)||0;
        if (af !== bf) return (sort.type === 'most') ? (bf - af) : (af - bf);
        const av = txt(a[col]).toLowerCase(), bv = txt(b[col]).toLowerCase();
        const cmp = av.localeCompare(bv, undefined, {numeric:true,sensitivity:'base'});
        if (cmp !== 0) return cmp;
        const at=parseIncidentTime(a['Incident Time']); const bt=parseIncidentTime(b['Incident Time']);
        return (bt?bt.getTime():-Infinity) - (at?at.getTime():-Infinity);
      });
    }
  } else {
    const sF = freqMap(out,'Source'); const dF = freqMap(out,'Destination');
    out.sort((a,b)=>{
      const as=sF.get(txt(a['Source']).trim())||0, bs=sF.get(txt(b['Source']).trim())||0; if(bs!==as) return bs-as;
      const ad=dF.get(txt(a['Destination']).trim())||0, bd=dF.get(txt(b['Destination']).trim())||0; if(bd!==ad) return bd-ad;
      const at=parseIncidentTime(a['Incident Time']); const bt=parseIncidentTime(b['Incident Time']);
      return (bt?bt.getTime():-Infinity) - (at?at.getTime():-Infinity);
    });
  }
  return out;
}

// Updates pager elements (page information and navigation buttons) for the active table.
function updatePager(tab, sectionEl, tableEl){
  const pager = sectionEl.querySelector(`#pager-${safeKey(tab.key)}`);
  const st = getTabState(tab.key);
  const total = tableEl.__meta.total, page = tableEl.__meta.page, pages = tableEl.__meta.pages;
  pager.innerHTML = '';
  const info = document.createElement('span');
  const start = (page-1)*st.pageSize + 1, end = Math.min(total, page*st.pageSize);
  info.textContent = total ? `Showing ${start}–${end} of ${total}` : 'No rows';
  pager.appendChild(info);
  const mk=(label,fn,dis)=>{const b=document.createElement('button'); b.className='btn'; b.textContent=label; b.disabled=!!dis; b.addEventListener('click',fn); return b;};
  pager.appendChild(mk('⏮', ()=>{ st.page=1; rerenderTabTable(tab,sectionEl); }, page<=1));
  pager.appendChild(mk('◀',  ()=>{ st.page=Math.max(1,st.page-1); rerenderTabTable(tab,sectionEl); }, page<=1));
  pager.appendChild(mk('▶',  ()=>{ st.page=Math.min(pages,st.page+1); rerenderTabTable(tab,sectionEl); }, page>=pages));
  pager.appendChild(mk('⏭', ()=>{ st.page=pages; rerenderTabTable(tab,sectionEl); }, page>=pages));
}

function rerenderTabTable(tab, sectionEl){

  updatePager(tab, sectionEl, tbl);
}

// Normalizes a filename for use as a safe download name.
function sanitizeFileName(s){
  let out = '';
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if((c>='a'&&c<='z')||(c>='A'&&c<='Z')||(c>='0'&&c<='9')||c==='_'||c==='-') out+=c; else out+='_';
  }
  return out;
}

// Exports the current table view (active page) to CSV.
function exportCurrentView(tab, tableEl){
  const rows = tableEl.__meta.pageRows; const cols = tableEl.__meta.visibleCols; const dq = '"', nl = '\n';
  const csv = [cols.join(',')].concat(
    rows.map(r=> cols.map(c=>{
      const v = (c==='Time') ? `ID ${txt(r['ID'])} | Incident ${txt(r['Incident Time'])} | Event ${txt(r['Event Time'])}` : txt(r[c]);
      return (v.includes(dq)||v.includes(',')||v.includes(nl)) ? dq+v.split(dq).join(dq+dq)+dq : v;
    }).join(','))
  ).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${sanitizeFileName(tab.label||'table')}_page${tableEl.__meta.page}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
}

// Copies the current table view (active page) to the clipboard as TSV.
function copyCurrentView(tableEl){
  const cols = tableEl.__meta.visibleCols;
  const header = cols.join('\t');
  const rows = tableEl.__meta.pageRows.map(r=>
    cols.map(c=> c==='Time'
      ? `ID ${txt(r['ID'])} | Incident ${txt(r['Incident Time'])} | Event ${txt(r['Event Time'])}`
      : txt(r[c])
    ).join('\t')
  ).join('\n');
  navigator.clipboard.writeText(header+'\n'+rows);
}

// Applies a drill-down filter to rows for a given column or domain.
function applyDrillFilter(universe, filter){
  let rows = universe.slice();
  if(filter.col === 'Domain'){
    rows = rows.filter(r=>{
      const semi  = txt(r['Destination']).split(';');
      const parts = semi.map(x=> x.split(',')).flat().map(s=> s.trim()).filter(Boolean);
      return parts.some(x=> getBaseDomain(x) === filter.value);
    });
  } else {
    rows = rows.filter(r=> txt(r[filter.col]).trim() === filter.value);
  }
  return rows;
}

// Opens a new drill-down tab based on the selected column and value.
function openFilterTab(col, value, fromTab){
  const universe = (fromTab ? fromTab.rows : state.raw);
  const rows = applyDrillFilter(universe, {col, value});
  const key = `flt::${col}::${safeKey(value)}::${Date.now()}`;
  const label = `${col}: ${value}`;
  const tab = { key, label, type:'drill', rows, closable:true, filter:{col, value} };
  state.tabs.push(tab);
  state.activeTab = key;
  renderTabs();
}

  const key = `adhoc::${safeKey(label)}::${Date.now()}`;
  const tab = { key, label, type:'drill', rows, closable:true, filter:null };
  state.tabs.push(tab);
  state.activeTab = key;
  renderTabs();
}

// Updates the incident time-range label from the loaded dataset.
function updateIncidentRange(){
  const el = document.getElementById('rangeVal');
  if (!el) return;

  if (!state.raw.length){
    el.textContent = '–';
    return;
  }

  const dates = state.raw
    .map(r => parseIncidentTime(r['Incident Time']))
    .filter(Boolean)
    .sort((a,b)=>a-b);

  if (!dates.length){
    el.textContent = '–';
    return;
  }

  const min = formatDateShort(dates[0]);
  const max = formatDateShort(dates[dates.length-1]);

  // Display the combined filenames (populated by the multi-file upload handler)
  el.textContent = (currentFilename ? currentFilename + ': ' : '') + `${min} – ${max}`;
}

// Parses a CSV file with Papa.parse and returns an object array.
function parseCSV(file){
  return new Promise((resolve, reject)=>{
    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      dynamicTyping: false,
      complete: res => resolve(res.data),
      error: reject
    });
  });
}

    e.preventDefault();
    const id = a.dataset.id;
    if(id){
      navigator.clipboard.writeText(id).then(()=>{
        console.log(`Incident ID ${id} copied`);
      });
    }
  }
});

// Delegation: all clicks on .copy-cell
document.addEventListener('click', e=>{
  const a = e.target.closest('.copy-cell');
  if(a){
    e.preventDefault();
    const val = a.dataset.value || a.textContent;
    if(val){
      navigator.clipboard.writeText(val).then(()=>{
        console.log(`Cell "${val}" copied`);
      });
    }
  }
});

/* =======================================================================================
setCookie: Sets a cookie with max-age and expires (Safari compatible).

safeKey: Generates a safe key for a DOM ID.

formatDateShort: Formats a Date object as yyyy-mm-dd.
sanitizeForPlain: Normalizes text into a safe single line (without newlines or tabs).
escapeHtml: Escapes special HTML characters.
sanitizeForTSV: Normalizes a value for TSV (removes tabs and newlines).
getRowCells: Generates [key, value] pairs for one data row.
buildRowClipboardHTML: Builds an HTML table for the clipboard (Excel/Office).
buildRowClipboardTSV: Builds vertical TSV (key<TAB>value) for the clipboard.
copyRowToClipboard: Copies one row to the clipboard as HTML and TSV (with fallback).
txt: Converts a value to a plain string.
stripGMT: Removes the " GMT..." portion from a time value.
justDate: Extracts only the date portion from "date, time".
timeCellHTML: Generates time-cell HTML with a tooltip and data ID.
clip: Truncates a string to a maximum length with an ellipsis.
timeCellPlainText: Builds a plain-text tooltip for time information.
freqMap: Generates a value-frequency map from an object array for a given key.
ensureCols: Ensures all required columns exist in a data row.
sanitizeHeaders: Normalizes object headers (trims key names).
normalizeSpaces: Normalizes common whitespace in a string.
smartSplit: Splits a semicolon-delimited list intelligently (ignores delimiters inside () or []).
stripSizeSuffix: Removes a file-size suffix from a token.
hasExtension: Checks whether a token has a file extension.
coreName: Gets the core name (without an extension).
shouldIgnoreCore: Determines whether a core name should be ignored (common noisy prefixes).
shouldIgnoreToken: Determines whether a filename token should be ignored (noise).
normalizeFileList: Normalizes a filename list: split, clean, filter noise, deduplicate, and join.
getBaseDomain: Gets the base domain from an email or host, accounting for common public suffixes.
splitDestParts: Splits a destination string into clean tokens (separated by ; and ,).
isEmailLike: Checks whether a string resembles a basic email address.
deepFreeze: Freezes an object (to a limited depth) to prevent modification.
secureCompilePredicate: Compiles user code into a safe predicate with a sandbox and API allowlist.
ingest: Converts and appends data rows to state, then updates tabs and the incident range.
buildTabs: Builds tab definitions from the dataset (overview, custom, blocked, per-channel, and saved tabs).
renderTabs: Renders tab buttons and click handlers, then renders the active tab and filter icons.
getTabState: Returns or initializes per-tab state (filters, pagination, and sorting).
renderActiveTab: Renders content for the active tab and synchronizes filter icons.
runChatbot: Calls the OpenAI API to generate a JavaScript predicate from a user prompt.
computeRuleMatchesChunked: Runs a predicate over rows in chunks to keep the UI responsive.
bindCardsClickOnce: Binds click handlers once to metric/rule cards to open ad hoc tabs.
computeDatasetHash: Creates a lightweight dataset hash for caching rule results.
loadRuleCache: Loads cached rule results from sessionStorage.
saveRuleCache: Stores cached rule results in sessionStorage (with cleanup fallback).
clearRuleCaches: Removes all rule-cache entries from sessionStorage.
getRowId: Generates a stable composite ID for a row (avoids collisions across files).
indexRowsById: Builds a Map index from row IDs to array indices.
renderOverview: Renders the Overview: metric cards, aggregate tables, and daily volume chart.
extractFirstEmail: Extracts the first valid email address from a string.
extractLocal: Extracts and normalizes the email local part.
commonPrefixLen: Calculates the common-prefix length of two strings.
levenshtein: Calculates Levenshtein distance with an early-exit threshold.
jaroWinkler: Calculates the Jaro-Winkler similarity score.
isSelfLike: Evaluates sender and recipient local-part similarity (self-like).
ruleSelfToSelf: Rule: true when a recipient resembles the sender.
ruleRecipientFreeMail: Rule: true when a recipient domain is a free email provider.
ruleShortOrEmptySubject: Rule: true when the email subject is empty or below the minimum length.
ruleAttachmentNoExtension: Rule: true when an attachment has no extension.
filenameCoreStrict: Extracts a normalized filename core for sequence detection.
fileCoresFromCell: Derives a list of unique filename cores from a cell.
extractStemTail: Extracts the stem and trailing number from a filename.
buildSequentialIndex: Builds a stem-to-numeric-tail-set index for each source.
getHotStemsBySource: Gets hot stems (unique tails ≥ threshold) for each source.
ruleSequentialAttachments: Rule: true when a row has an attachment with a hot stem for its source.
ruleSensitiveKeywords: Rule: true when sensitive keywords appear in the subject, filename, or policies.
buildSenderDomainCounts: Calculates destination-domain frequency per sender.
ruleRepeatedDomainBySender: Rule: true when a sender repeatedly sends to the same domain above the threshold.
ruleWeirdTLD: Rule: true when the destination domain uses an unusual TLD (xyz/top/icu).
ruleOutOfHours: Rule: true when an incident occurs between 00:00 and 04:59.
makeSimpleTableEl: Builds a simple table element from headers and rows (not clickable).
makeClickableTable: Builds a table section whose contents open drill-down filters when clicked.
aggregateDomains: Aggregates row counts by unique destination domain (based on base domain).
aggregateByDay: Aggregates alert counts by day (based on Incident Time, ISO yyyy-mm-dd).
makeLineChart: Draws a responsive SVG line chart with axes, grid, and interactive tooltips.
renderTableSection: Renders a tab table section with pagination, export, copy, and page-size controls.
renderCustomTab: Renders the Custom JS tab with API-key input, chatbot, predicate editor, and results.
renderDataTable: Renders a tab data table with filtering, sorting, pagination, and metadata.
updateFilterIcons: Updates table-header filter icons to match the tab filter state.
openFilterPopover: Opens a filter/sort popover for a column and applies user actions.
positionPopover: Positions a popover absolutely relative to its anchor.

applyFiltersAndSort: Applies filtering and sorting to a row array and returns the result.
updatePager: Updates pager elements (page information and navigation buttons) for the active table.

rerenderActive: Rerenders the active tab (used after filters or sorting change).
sanitizeFileName: Normalizes a filename for use as a safe download name.
exportCurrentView: Exports the current table view (active page) to CSV.
copyCurrentView: Copies the current table view (active page) to the clipboard as TSV.
applyDrillFilter: Applies a drill-down filter to rows for a given column or domain.
openFilterTab: Opens a new drill-down tab based on the selected column and value.
openAdHocTab: Opens a new ad hoc tab containing the provided rows.
updateIncidentRange: Updates the incident time-range label from the loaded dataset.
parseCSV: Parses a CSV file with Papa.parse and returns an object array.
