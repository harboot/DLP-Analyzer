<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forcepoint DLP Alerts Analyzer v2.2</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="csv-utils.js"></script>
  <script src="dlp-utils.js"></script>

  <link rel="stylesheet" href="styles.css" />
</head>

<body class="page-alert-analyzer tool-page">
<div class="wrap">
  <div class="panel">
    <div class="row">
      <div class="row-left">
        <h1 style="margin:0">Forcepoint DLP Alerts Analyzer</h1>
        <span class="row-dark"> - v25.8 | hendryadrian.com </span>
      </div>
      <div class="row-right">
        <span id="rangeLabel" class=""><span id="rangeVal">–</span></span>
        <label class="drop" id="drop">
          <input id="file" type="file" multiple accept=".csv,text/csv" />
          <strong>Drop</strong> a CSV here or click to select
        </label>
        <button id="demoBtn" class="btn">Load sample</button>
      </div>
    </div>
  </div>

  <nav class="tabs" id="tabs" style="margin-top:12px"></nav>
  <div id="panels" class="grid" style="margin-top:12px"></div>
</div>

<script src="utils.js"></script>
<script src="storage.js"></script>
<script src="ai.js"></script>
<script src="rules.js"></script>
<script src="ui.js"></script>
<script src="csv.js"></script>
</body>
</html>
