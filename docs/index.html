<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="offline.js" defer></script>
  <title>DLP Analyzer</title>

  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="components.css" />
</head>
<body class="page-dlp-tools tool-page">
  <div class="host">
    <header id="topbar" class="topbar" role="navigation" aria-label="Main menu">
      <div class="brand" aria-label="App title">DLP Analyzer</div>
      <div class="app-version" aria-label="Version 46">v46</div>
      <nav class="menu" aria-label="Tools">
        <button class="menu-trigger" id="menuTrigger" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="toolMenu">
          <span class="sr-only">Open tools menu</span><span aria-hidden="true">&#8942;</span>
        </button>
        <div class="menu-popover" id="toolMenu" role="menu" hidden>
          <button class="tab" data-key="AlertAnalyzer" role="menuitemradio" aria-checked="false"><span class="menu-icon" aria-hidden="true">&#9888;</span><span>Alert Analyzer</span></button>
          <button class="tab" data-key="CardManager" role="menuitemradio" aria-checked="false"><span class="menu-icon" aria-hidden="true">&#9830;</span><span>Risk Scoring</span></button>
          <button class="tab" data-key="PolicyViewer" role="menuitemradio" aria-checked="false"><span class="menu-icon" aria-hidden="true">&#128196;</span><span>Policy Viewer</span></button>
          <button class="tab" data-key="PolicyTuningAdvisor" role="menuitemradio" aria-checked="false"><span class="menu-icon" aria-hidden="true">&#9881;</span><span>Policy Tuning Advisor</span></button>
          <button class="tab" data-key="RuleIdentifier" role="menuitemradio" aria-checked="false"><span class="menu-icon" aria-hidden="true">&#128269;</span><span>Policies Matcher</span></button>
          <button class="tab" data-key="DocViewer" role="menuitemradio" aria-checked="false"><span class="menu-icon" aria-hidden="true">&#128065;</span><span>Document Viewer</span></button>
          <button class="tab" data-key="KeywordGenerator" role="menuitemradio" aria-checked="false"><span class="menu-icon" aria-hidden="true">&#128273;</span><span>Keyword Generator</span></button>
          <div class="menu-separator" role="separator"></div>
          <button class="menu-action" id="checkUpdate" type="button" role="menuitem"><span class="menu-icon" aria-hidden="true">&#8635;</span><span>Check for updates</span></button>
        </div>
      </nav>
      <div id="spinner" class="spinner" aria-hidden="true"><span class="spin" aria-label="Loading" title="Loading..."></span></div>
    </header>

    <div id="updateStatus" class="update-status" role="status" aria-live="polite" hidden></div>

    <main id="content" class="content">
      <iframe id="appFrame" class="frame" title="DLP Analyzer content" loading="eager" referrerpolicy="no-referrer"></iframe>
      <div id="overlay" class="overlay" role="status" aria-live="polite"></div>
    </main>
  </div>

  <script>
    const BASE_PATH = './';
    const PAGES = ['AlertAnalyzer','CardManager','PolicyViewer','PolicyTuningAdvisor','RuleIdentifier','DocViewer','KeywordGenerator'];
    const DEFAULT_KEY = 'AlertAnalyzer';

    const tabs = Array.from(document.querySelectorAll('.tab'));
    const menuTrigger = document.getElementById('menuTrigger');
    const toolMenu = document.getElementById('toolMenu');
    const checkUpdate = document.getElementById('checkUpdate');
    const updateStatus = document.getElementById('updateStatus');
    const frame = document.getElementById('appFrame');
    const spinner = document.getElementById('spinner');
    const overlay = document.getElementById('overlay');

    let currentKey = null;
    let updateStatusTimer = null;
    const frameCache = {}; // cache DOM iframes to avoid reloads

    const pathFor = key => BASE_PATH + key + '.html';

    function showUpdateStatus(message, state = 'success') {
      window.clearTimeout(updateStatusTimer);
      updateStatus.textContent = message;
      updateStatus.dataset.state = state;
      updateStatus.hidden = false;
      updateStatusTimer = window.setTimeout(() => { updateStatus.hidden = true; }, 5000);
    }

    function keyFromHash(){
      const raw = (location.hash || '').replace(/^#+/,'').trim();
      if (!raw) return DEFAULT_KEY;
      return PAGES.includes(raw) ? raw : DEFAULT_KEY;
    }

    function setActiveTab(key){
      tabs.forEach(btn => btn.setAttribute('aria-checked', String(btn.dataset.key === key)));
    }

    function setMenuOpen(open, { focus = false } = {}) {
      toolMenu.hidden = !open;
      menuTrigger.setAttribute('aria-expanded', String(open));
      if (open && focus) (tabs.find(btn => btn.getAttribute('aria-checked') === 'true') || tabs[0]).focus();
    }

    const showSpinner = (show) => {
      spinner.style.display = show ? 'inline-block' : 'none';
      spinner.setAttribute('aria-hidden', String(!show));
    };

    function showOverlay(message, key){
      overlay.innerHTML = `
        <div class="row">
          <div>${message}</div>
          <div class="overlay-actions">
            <button class="btn" type="button" data-act="retry" data-key="${key}">Retry</button>
            <a class="btn" href="${pathFor(key)}" target="_blank" rel="noopener">Open in new tab</a>
          </div>
        </div>`;
      overlay.style.display = 'block';
    }
    function hideOverlay(){ overlay.style.display = 'none'; overlay.innerHTML = ''; }

    function navigateTo(key){
      if (key === currentKey) return;
      currentKey = key;
      setActiveTab(key);
      hideOverlay();
      showSpinner(true);

      // Use cache: if iframe for this key exists, show it; otherwise create new
      Object.entries(frameCache).forEach(([k, el]) => {
        el.style.display = (k === key) ? 'block' : 'none';
      });

      if (frameCache[key]){
        showSpinner(false);
      } else {
        const newFrame = document.createElement('iframe');
        newFrame.className = 'frame';
        newFrame.title = key;
        newFrame.src = pathFor(key);
        newFrame.onload = () => { showSpinner(false); };
        newFrame.onerror = () => { showSpinner(false); showOverlay(`An error occurred while loading <b>${key}.html</b>.`, key); };
        document.getElementById('content').appendChild(newFrame);
        frameCache[key] = newFrame;
        showSpinner(false);
      }
    }

    tabs.forEach(btn => {
      btn.addEventListener('click', () => {
        setMenuOpen(false);
        const key = btn.dataset.key;
        if (location.hash.replace(/^#+/,'') !== key){
          location.hash = key;
        } else {
          navigateTo(key);
        }
      });
    });

    checkUpdate.addEventListener('click', async () => {
      setMenuOpen(false);
      const label = checkUpdate.lastElementChild;
      label.textContent = 'Checking for updates…';
      checkUpdate.disabled = true;
      try {
        const found = await window.DLPOffline?.checkForUpdate();
        const message = found ? 'Update found. DLP Analyzer will reload automatically.' : 'DLP Analyzer is up to date.';
        label.textContent = found ? 'Update found' : 'DLP Analyzer is up to date';
        showUpdateStatus(message);
      } catch (_) {
        label.textContent = 'Unable to check for updates';
        showUpdateStatus('Unable to check for updates. Please try again.', 'error');
      } finally {
        checkUpdate.disabled = false;
        window.setTimeout(() => { label.textContent = 'Check for updates'; }, 2500);
      }
    });

    menuTrigger.addEventListener('click', () => {
      setMenuOpen(menuTrigger.getAttribute('aria-expanded') !== 'true', { focus: true });
    });
    document.addEventListener('click', event => {
      if (!event.target.closest('.menu')) setMenuOpen(false);
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !toolMenu.hidden) {
        setMenuOpen(false);
        menuTrigger.focus();
      }
    });

    window.addEventListener('hashchange', () => navigateTo(keyFromHash()));

    (function init(){
      PAGES.forEach(key => {
        const link = document.createElement('link');
        link.rel = 'prefetch';
        link.href = pathFor(key);
        link.as = 'document';
        document.head.appendChild(link);
      });
      const key = keyFromHash();
      if (!location.hash) location.hash = key;
      setActiveTab(key);
      navigateTo(key);
      overlay.addEventListener('click', (e) => {
        const t = e.target.closest('[data-act="retry"][data-key]');
        if (t){
          hideOverlay();
          navigateTo(String(t.getAttribute('data-key')));
        }
      });
    })();
  </script>
</body>
</html>
