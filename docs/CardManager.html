<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>JS Snippet Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="styles.css" />
</head>

<body class="page-card-manager tool-page">
  <div class="wrap">
    <h1>JS Snippet Manager</h1>
    <p class="sub">Store JavaScript snippets. Create files, edit, rename, delete, import/export JSON, and run filters on CSV.</p>

    <div class="panel">
      <div class="row">
        <div class="row-left">
          <button class="btn" id="btnNewFile" title="New file">➕📄 New File</button>
          <button class="btn" id="btnExport" title="Export JSON">⬇️ Export JSON</button>
          <label class="drop" for="fileImport" title="Import JSON">📥 Import JSON</label>
          <input id="fileImport" type="file" accept="application/json" />
          <button class="btn" id="btnUpload" title="Upload CSV">📤 Upload</button>
          <button class="btn" id="btnRunAll" title="Run enabled snippets on loaded CSV">✅ RUN ALL</button>
          <input id="csvInput" type="file" multiple accept=".csv,text/csv" />
        </div>
        <div class="row-right">
		  <input id="search" class="textinput" placeholder="Search by name or content..." style="min-width:160px" />
          <span id="csvName" class="muted-sm"></span>
        </div>
      </div>
    </div>

    <div class="layout">
      <section class="section" aria-label="Items">
        <header>
          <strong>Items</strong>
          <div class="right"><span class="muted-sm">Total: <span id="count">0</span></span></div>
        </header>
        <div class="list">
          <table id="tbl">
            <thead>
              <tr>
                <th class="name"></th>
                <th class="matches"></th>
                <th class="actions"></th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </section>

      <section class="section" aria-label="Editor">
        <header>
          <strong id="editorTitle">Edit File</strong>
          <div class="right"><span id="currentPath" class="muted-sm"></span></div>
        </header>
        <div class="editor">
          <label>
            <div class="muted-sm">File name</div>
            <input id="inpName" class="textinput" placeholder="e.g. util-formatDate.js" />
          </label>

          <label>
            <div class="muted-sm">JavaScript code</div>
            <textarea id="inpCode" class="cjs-textarea" spellcheck="false" placeholder="// Boolean predicate per row.
// Example:
// return (row.Status||'') === 'New';
"></textarea>
          </label>

          <div class="right" style="justify-content:space-between">
            <div class="status" id="meta">&nbsp;</div>
            <div class="right">
              <button class="btn" id="btnRunThis" title="Run this snippet on loaded CSV">▶️ RUN</button>
              <div class="toggle" id="editorToggle" title="Toggle ON/OFF">
                <span class="label" id="toggleLabel">OFF</span>
                <div class="switch" id="toggleSwitch" data-on="false" aria-pressed="false" role="button"></div>
              </div>
              <button class="icon-btn" id="btnSave" title="Save">💾</button>
              <button class="icon-btn" id="btnDelete" title="Delete file">🗑️</button>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <div id="resultWrap">
    <output id="onNames" class="muted-sm">Upload the CSV first, then press RUN ALL or RUN on a specific file…</output>
  </div>

<script>

const LS_KEY = 'jsSnippetItems:v3';

/* Selects the first element matching a selector. */
const $ = (s) => document.querySelector(s);

/* Returns an array of all elements matching a selector. */
const $$ = (s) => Array.from(document.querySelectorAll(s));

/* Creates a short random ID for a file item. */
const uid = () => 'id_' + Math.random().toString(36).slice(2, 10);

/* Converts special characters to safe HTML entities. */
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (m) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])
  );
}

/* Converts a value to a display-safe string. */
function safe(v) {
  return v == null ? '' : String(v);
}


/* =================================================================== */
/* == CLIPBOARD COPY FUNCTIONS (ADDED/MODIFIED) == */
/* =================================================================== */

// Gets cells from a row object and converts them to a [key, value] array
function getRowCells(row) {
  return Object.entries(row).map(([k, v]) => [String(k), String(v ?? '')]);
}

// Sanitizes a string for TSV (Tab-Separated Values)
function sanitizeForTSV(v) {
  return String(v ?? '').replace(/\t/g, ' ').replace(/[\r\n]/g, ' ');
}

// Builds an HTML table for the clipboard (Excel/Office)
function buildRowClipboardHTML(row) {
  const cells = getRowCells(row);
  const head = `
  <style>
    table.dlp-copy { border-collapse: collapse; font-family: system-ui, Arial, sans-serif; font-size: 13px; }
    .dlp-copy th, .dlp-copy td { border:1px solid #ccc; padding:6px 8px; text-align:left; vertical-align:top; }
    .dlp-copy th { background:#f6f6f6; width:220px; }
  </style>`;
  const rows = cells.map(([k, v]) => `<tr><th>${escapeHtml(k)}</th><td>${escapeHtml(v)}</td></tr>`).join('');
  return `<!doctype html><html><head>${head}</head><body><table class="dlp-copy">${rows}</table></body></html>`;
}

// Builds vertical TSV (key<TAB>value) for the clipboard
function buildRowClipboardTSV(row) {
  const cells = getRowCells(row);
  const lines = cells.map(([k, v]) => `${sanitizeForTSV(k)}\t${sanitizeForTSV(v)}`);
  return lines.join('\n') + '\n';
}

// Copies one row to the clipboard as HTML and TSV (with fallback)
async function copyRowToClipboard(row, targetButton) {
  const html = buildRowClipboardHTML(row);
  const tsvText = buildRowClipboardTSV(row);
  try {
    if (navigator.clipboard && window.ClipboardItem) {
      const item = new ClipboardItem({
        'text/html': new Blob([html], { type: 'text/html' }),
        'text/plain': new Blob([tsvText], { type: 'text/plain' })
      });
      await navigator.clipboard.write([item]);
    } else if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(tsvText);
    } else {
      const ta = document.createElement('textarea');
      ta.value = tsvText;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    // Provide visual feedback on the clicked button
    if (targetButton) {
        targetButton.textContent = '✅';
        setTimeout(() => { targetButton.textContent = '📋'; }, 1500);
    }
  } catch (e) {
    console.error('Copy failed:', e);
    if (targetButton) {
        targetButton.textContent = '❌';
        setTimeout(() => { targetButton.textContent = '📋'; }, 1500);
    }
  }
}

/* =================================================================== */
/* ================ END OF CLIPBOARD FUNCTIONS ==================== */
/* =================================================================== */


/* Loads the item list from localStorage. */
function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(LS_KEY));
    return Array.isArray(raw) ? raw : [];
  } catch {
    return [];
  }
}

/* Saves the item list to localStorage. */
function save(items) {
  localStorage.setItem(LS_KEY, JSON.stringify(items));
}

/* Migrates legacy data (v2) to the new format when the v3 key does not exist. */
(function migrate() {
  try {
    if (localStorage.getItem(LS_KEY)) return;
    const v2 = JSON.parse(localStorage.getItem('jsSnippetItems:v2') || '[]');
    const onlyFiles = (Array.isArray(v2) ? v2 : [])
      .filter((x) => x && x.type === 'file')
      .map((x) => ({ id: x.id || uid(), type: 'file', name: x.name, code: x.code || '' }));
    if (onlyFiles.length) localStorage.setItem(LS_KEY, JSON.stringify(onlyFiles));
  } catch {}
})();

let items = load();
if (items.length === 0) {
  items.push({
    id: uid(),
    type: 'file',
    name: 'example.js',
    code: "// example: accept rows with Status=New\nreturn (row.Status||'')==='New';",
    enabled: false
  });
  save(items);
}

let currentFileId = null;
let filter = '';
const elTbody = $('#tbody');
const elCount = $('#count');
const elSearch = $('#search');
const elTitle = $('#editorTitle');
const elPath = $('#currentPath');
const elName = $('#inpName');
const elCode = $('#inpCode');
const elMeta = $('#meta');
const elRunThis = $('#btnRunThis');

/* Returns all items of type 'file'. */
function files() {
  return items.filter((x) => x.type === 'file');
}

/* Finds a file by ID, or returns null when none exists. */
function fileById(id) {
  return items.find((x) => x.type === 'file' && x.id === id) || null;
}

/* Applies text search to filenames and file contents. */
function applyFilter(list) {
  if (!filter) return list;
  const q = filter.toLowerCase();
  return list.filter(
    (x) => x.name.toLowerCase().includes(q) || (x.code || '').toLowerCase().includes(q)
  );
}

/* Gets the cell in a given file row for a specified class. */
function getRowCell(fileId, cls) {
  return elTbody.querySelector(`tr[data-id="${fileId}"] .${cls}`);
}

/* Reads one CSV File and returns rows as an object array. */
function parseCSVFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Failed to read CSV.'));
    reader.onload = () => {
      try {
        let text = String(reader.result || '');
        if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
        resolve(parseCSV(text));
      } catch (e) {
        reject(e);
      }
    };
    reader.readAsText(file);
  });
}

/* Parses CSV text into an object array (automatically detects the delimiter). */
/* Parses CSV text into an object array (automatically detects the delimiter). */
/* Parses CSV text into an object array (automatically detects the delimiter). */
function parseCSV(text) {
  const s = text.replace(/\r\n?/g, '\n');

  // --- NEW LOGIC START: Combine split lines (multiline fields) ---
  const physicalLines = s.split('\n');
  const logicalLines = [];
  let currentLineBuffer = '';

  for (const line of physicalLines) {
    // Add the current physical line to the buffer, plus the newline removed by .split()
    // if the buffer already contained data.
    if (currentLineBuffer) {
        currentLineBuffer += '\n';
    }
    currentLineBuffer += line;

    // Count unescaped quotes (") (excluding "") in the buffer
    const quoteCount = (currentLineBuffer.match(/(?<!")"(?!")/g) || []).length;

    // An even quote count means that all opening quotes have been closed.
    // This logical line is complete.
    if (quoteCount % 2 === 0) {
      logicalLines.push(currentLineBuffer);
      currentLineBuffer = ''; // Reset the buffer for the next logical line
    }
  }

  // If data remains in the buffer after the loop (for example, the file ends inside a quoted field),
  // append it as the final line.
  if (currentLineBuffer) {
    logicalLines.push(currentLineBuffer);
  }
  // --- NEW LOGIC END ---

  // Continue processing with the corrected 'logicalLines'
  const finalLines = logicalLines;
  while (finalLines.length && !finalLines[0].trim()) finalLines.shift();
  while (finalLines.length && !finalLines[finalLines.length - 1].trim()) finalLines.pop();
  if (!finalLines.length) return [];

  const delim = detectDelimiter(finalLines);
  const headers = splitCSVLine(finalLines[0], delim);
  const rows = [];

  for (let r = 1; r < finalLines.length; r++) {
    let line = finalLines[r];
    if (!line.trim()) continue;

    // Keep the existing trailing-comma patch
    if (line.endsWith(delim)) {
      line = line.slice(0, -1);
    }

    const cells = splitCSVLine(line, delim);
    if (cells.every((x) => !String(x || '').trim())) continue;

    const obj = {};
    headers.forEach((h, idx) => (obj[h] = cells[idx] !== undefined ? cells[idx] : ''));
    rows.push(obj);
  }

  return rows;
}

/* Detects the best CSV delimiter from sample rows (comma, semicolon, or tab). */
function detectDelimiter(lines) {
  const CAND = [',', ';', '\t'];
  const sample = lines.slice(0, Math.min(25, lines.length));
  let best = ',';
  let bestScore = -Infinity;
  for (const d of CAND) {
    const headerCells = splitCSVLine(sample[0] || '', d);
    const target = headerCells.length;
    let consistent = 0;
    for (let i = 0; i < sample.length; i++) {
      const n = splitCSVLine(sample[i], d).length;
      if (n === target) consistent++;
    }
    const score = (target > 1 ? 1000 : 0) + consistent * 10 + target;
    if (score > bestScore) {
      bestScore = score;
      best = d;
    }
  }
  return best;
}

/* Splits one CSV row into cells while respecting quotes. */
function splitCSVLine(line, delim) {
  const out = [];
  let cur = '';
  let inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') {
      if (inQ && line[i + 1] === '"') {
        cur += '"';
        i++;
      } else {
        inQ = !inQ;
      }
    } else if (c === delim && !inQ) {
      out.push(cur);
      cur = '';
    } else {
      cur += c;
    }
  }
  out.push(cur);
  return out;
}

/* Compiles a JS predicate safely (restricts dangerous global access). */
function secureCompilePredicate(code) {
  const PRELUDE = `
    const window=undefined, document=undefined, globalThis=undefined,
          Function=undefined, eval=undefined, fetch=undefined,
          XMLHttpRequest=undefined, localStorage=undefined,
          sessionStorage=undefined, indexedDB=undefined, WebSocket=undefined;
  `;
  let fn;
  try {
    fn = new Function('row', 'rows', 'i', `${PRELUDE}\n${code}`);
  } catch (e) {
    throw e;
  }
  return (row, rows, i) => {
    try {
      return !!fn(row, rows, i);
    } catch (_) {
      return false;
    }
  };
}

/* Normalizes a filename list into a '; '-separated format. */
function normalizeFileList(v) {
  const s = String(v == null ? '' : v);
  if (!s.trim()) return '';
  const parts = s.split(/[;\n,]/).map((x) => x.trim()).filter(Boolean);
  return parts.join('; ');
}

/* Converts a row into a consistent camelCase version for processing. */
function ensureCamelRow(r) {
  const IncidentTime = r['Incident Time'] ?? r.IncidentTime ?? '';
  const EventTime = r['Event Time'] ?? r.EventTime ?? '';
  const FileNameRaw = r['File Name'] ?? r.FileName ?? '';
  const SizeRaw = r['Transaction Size (KB)'] ?? r['Size'] ?? r.Size ?? '';
  return {
    ID: r['ID'] ?? r.ID ?? '',
    IncidentTime: IncidentTime,
    EventTime: EventTime,
    FileName: normalizeFileList(FileNameRaw),
    Size: String(SizeRaw),
    Source: r['Source'] ?? r.Source ?? '',
    Policies: normalizeFileList(r['Policies'] ?? r.Policies ?? ''),
    Channel: r['Channel'] ?? r.Channel ?? '',
    Destination: normalizeFileList(r['Destination'] ?? r.Destination ?? ''),
    Details: r['Details'] ?? r.Details ?? '',
    Status: r['Status'] ?? r.Status ?? ''
  };
}

/* Evaluates a predicate in batches to keep the UI responsive; returns matching rows. */
async function computeMatches(rawRows, normalizedRows, predicate, { chunk = 800, onProgress } = {}) {
  const rows = normalizedRows;
  const out = [];
  for (let start = 0; start < rows.length; start += chunk) {
    const end = Math.min(rows.length, start + chunk);
    for (let i = start; i < end; i++) {
      let ok = false;
      try {
        ok = !!predicate(rows[i], rows, i);
      } catch (_) {
        ok = false;
      }
      if (ok) out.push(rawRows[i]);
    }
    onProgress && onProgress(out.length, end, rows.length);
    await new Promise((r) => setTimeout(r, 0));
  }
  return out;
}

/* Renders the file list in the left table and attaches row event handlers. */
function render() {
  const fileList = applyFilter(files()).sort((a, b) => a.name.localeCompare(b.name));
  const rows = [];
  fileList.forEach((fl) => {
    if (typeof fl.enabled !== 'boolean') fl.enabled = false;
    const tr = document.createElement('tr');
    tr.className = 'file';
    tr.setAttribute('data-id', fl.id);
    tr.innerHTML = `
      <td class="name" title="${fl.name}">${fl.enabled ? '✅ ' : '📄 '}${fl.name}</td>
      <td class="matches" data-role="matches"><span class="badge" title="RUN to compute">—</span></td>
      <td class="actions">
        <button class="icon-btn" title="Delete" data-act="del" data-id="${fl.id}">🗑️</button>
      </td>`;
    rows.push(tr);
  });
  elTbody.replaceChildren(...rows);
  elCount.textContent = fileList.length;
  $$('#tbody [data-act="del"]').forEach((btn) => {
    const id = btn.getAttribute('data-id');
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      deleteFile(id);
    });
  });
  $$('#tbody tr.file').forEach((tr) => {
    tr.addEventListener('click', (e) => {
      if (e.target.closest('[data-act="del"]')) return;
      const id = tr.getAttribute('data-id');
      if (id) openEditor(id);
    });
  });
}

/* Creates a new empty file and opens it in the editor. */
function newFile() {
  let name = 'untitled.js';
  let i = 1;
  while (items.some((x) => x.type === 'file' && x.name === name)) name = `untitled-${i++}.js`;
  const f = { id: uid(), type: 'file', name, code: '', enabled: false };
  items.push(f);
  save(items);
  render();
  openEditor(f.id);
}

/* Opens the editor for a given file ID and populates the editor fields. */
function openEditor(id) {
  const file = fileById(id);
  if (!file) return;
  currentFileId = id;
  if (typeof file.enabled !== 'boolean') file.enabled = false;
  elTitle.textContent = 'Edit File';
  elName.value = file.name;
  elCode.value = file.code || '';
  elPath.textContent = file.name;
  elMeta.textContent = 'Ready';
  elName.focus();
  setToggle(!!file.enabled, { persist: false });
}

/* Saves changes to the currently open file. */
function saveCurrent() {
  if (!currentFileId) {
    alert('No file selected.');
    return;
  }
  const file = fileById(currentFileId);
  if (!file) return;
  const newName = elName.value.trim();
  if (!newName) {
    alert('File name is required.');
    elName.focus();
    return;
  }
  if (items.find((x) => x.type === 'file' && x.id !== file.id && x.name === newName)) {
    alert('A file with the same name already exists.');
    return;
  }
  file.name = newName;
  file.code = elCode.value;
  save(items);
  render();
  elPath.textContent = file.name;
  elMeta.textContent = 'Saved';
}

/* Deletes a file by ID after confirmation, then rerenders. */
function deleteFile(id) {
  const file = fileById(id);
  if (!file) return;
  if (!confirm(`Delete file "${file.name}"?`)) return;
  items = items.filter((x) => !(x.type === 'file' && x.id === id));
  if (currentFileId === id) {
    currentFileId = null;
    clearEditor();
  }
  save(items);
  render();
}

/* Resets the editor view to an empty state. */
function clearEditor() {
  elTitle.textContent = 'Editor';
  elName.value = '';
  elCode.value = '';
  elPath.textContent = '';
  elMeta.textContent = '';
}

/* Exports all files to JSON and downloads the result. */
function exportJSON() {
  const data = JSON.stringify({
    version: 3,
    items: files().map((f) => ({
      id: f.id,
      name: f.name,
      code: f.code,
      type: 'file',
      enabled: !!f.enabled
    }))
  }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `snippets-${new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-')}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

/* Imports files from JSON (merge/replace by name), then renders. */
function importJSON(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const obj = JSON.parse(reader.result);
      const incoming = Array.isArray(obj) ? obj : obj.items || [];
      let added = 0;
      let updated = 0;
      incoming.forEach((it) => {
        if (!it || it.type !== 'file' || !it.name) return;
        const m = items.find((x) => x.type === 'file' && x.name === it.name);
        if (m) {
          m.code = it.code || '';
          m.enabled = !!it.enabled;
          updated++;
        } else {
          items.push({
            id: it.id || uid(),
            type: 'file',
            name: it.name,
            code: it.code || '',
            enabled: !!it.enabled
          });
          added++;
        }
      });
      save(items);
      render();
      alert(`Import done. Added: ${added}, Updated: ${updated}.`);
    } catch (e) {
      alert('Invalid JSON.');
    }
  };
  reader.readAsText(file);
}

$('#btnNewFile').addEventListener('click', newFile);
$('#btnExport').addEventListener('click', exportJSON);
$('#fileImport').addEventListener('change', (e) => {
  const f = e.target.files[0];
  if (f) importJSON(f);
  e.target.value = '';
});
$('#btnSave').addEventListener('click', saveCurrent);
$('#btnDelete').addEventListener('click', () => {
  if (currentFileId) deleteFile(currentFileId);
});
$('#search').addEventListener('input', () => {
  filter = $('#search').value;
  render();
});
elName.addEventListener('input', () => {
  elMeta.textContent = 'Unsaved changes';
});
elCode.addEventListener('input', () => {
  elMeta.textContent = 'Unsaved changes';
});

const elToggleSwitch = document.getElementById('toggleSwitch');
const elToggleLabel = document.getElementById('toggleLabel');

/* Sets the ON/OFF toggle and optionally saves it to the active item. */
function setToggle(on, { persist = true } = {}) {
  const val = !!on;
  elToggleSwitch.dataset.on = String(val);
  elToggleSwitch.setAttribute('data-on', String(val));
  elToggleSwitch.setAttribute('aria-pressed', String(val));
  elToggleLabel.textContent = val ? 'ON' : 'OFF';
  if (persist && currentFileId) {
    const f = fileById(currentFileId);
    if (f) {
      f.enabled = val;
      save(items);
      render();
    }
  }
}

/* Returns the toggle state as a boolean. */
function getToggleBoolean() {
  return elToggleSwitch?.dataset.on === 'true';
}

elToggleSwitch.addEventListener('click', () => {
  setToggle(!getToggleBoolean());
  const toggleName = getToggleBoolean() ? 'ON' : 'OFF';
  elMeta.textContent = `Toggle: ${toggleName} (${getToggleBoolean()})`;
});

/* ===== RUN FLOW (Upload & Run All & Run This) ===== */
const csvInput = $('#csvInput');
const btnUpload = $('#btnUpload');
const btnRunAll = $('#btnRunAll');
const csvNameEl = $('#csvName');
if (csvInput) csvInput.style.display = 'none';

let lastCSVRows = null;
let normalizedCSVRows = null;
let normalizedRowByRaw = new WeakMap();
const matchesCache = new Map();

btnUpload.addEventListener('click', () => {
  csvInput.value = '';
  csvInput.click();
});

csvInput.addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []);
  const out = document.getElementById('onNames');
  if (!files.length) return;
  matchesCache.clear();
  $$('#tbody .matches').forEach((c) => (c.innerHTML = `<span class="badge">—</span>`));
  try {
    out.textContent = 'Loading CSV…';
    const merged = [];
    let totalRows = 0;
    for (const f of files) {
      const rows = await parseCSVFile(f);
      merged.push(...rows);
      totalRows += rows.length;
    }
    lastCSVRows = merged;
    // Normalization is intentionally done once per upload. Every snippet reuses
    // this array instead of rebuilding the same row objects for every run.
    normalizedRowByRaw = new WeakMap();
    normalizedCSVRows = merged.map((row) => {
      const normalized = ensureCamelRow(row);
      normalizedRowByRaw.set(row, normalized);
      return normalized;
    });
    const names = files.map((f) => f.name).join(', ');
    csvNameEl.textContent = `${names} (${totalRows} rows total)`;
    matchesCache.clear();
    $$('#tbody .matches').forEach((c) => (c.innerHTML = `<span class="badge">—</span>`));
    out.textContent = totalRows ?
      'CSV loaded. Press RUN ALL or open a file and press RUN for that file.' :
      'CSV loaded with 0 parsed data rows.';
  } catch (err) {
    csvNameEl.textContent = '';
    out.textContent = 'CSV error: ' + (err?.message || String(err));
  } finally {
    csvInput.value = '';
  }
});

btnRunAll.addEventListener('click', async () => {
  const out = document.getElementById('onNames');
  if (!lastCSVRows) {
    out.textContent = 'No CSV yet. Click Upload first.';
    return;
  }
  matchesCache.clear();
  $$('#tbody .matches').forEach((c) => (c.innerHTML = `<span class="badge">—</span>`));
  const enabledFiles = files().filter((f) => !!f.enabled).sort((a, b) => a.name.localeCompare(b.name));
  if (enabledFiles.length === 0) {
    out.textContent = 'No items are ON. Toggle ON first, then RUN ALL.';
    return;
  }
  for (const fl of enabledFiles) {
    const cell = getRowCell(fl.id, 'matches');
    if (cell) {
      cell.innerHTML =
        `<span class="badge" data-role="count" data-id="${fl.id}">0</span><span class="spin" aria-label="Loading"></span>`;
    }
  }
  for (const fl of enabledFiles) {
    await runOneFileInternal(fl.id, { updateUI: true });
  }
  bindOpenMatches();
  out.textContent = 'Done. Click the Matches number to see the results.';
});

if (elRunThis)
  elRunThis.addEventListener('click', async () => {
    const out = document.getElementById('onNames');
    if (!currentFileId) {
      out.textContent = 'Select a file first.';
      return;
    }
    if (!lastCSVRows || !lastCSVRows.length) {
      out.textContent = 'No CSV yet. Click Upload first.';
      return;
    }
    await runOneFileInternal(currentFileId, { updateUI: true, openTable: true });
    bindOpenMatches();
  });

/* Runs one snippet file against the CSV dataset, updates the UI, and optionally opens the results table. */
async function runOneFileInternal(fileId, { updateUI = false, openTable = false } = {}) {
  const f = fileById(fileId);
  if (!f) return;
  const cell = getRowCell(fileId, 'matches');
  if (updateUI && cell) {
    cell.innerHTML =
      `<span class="badge" data-role="count" data-id="${fileId}">0</span><span class="spin" aria-label="Loading"></span>`;
  }
  let predicate;
  try {
    predicate = secureCompilePredicate(f.code || '');
  } catch (err) {
    if (updateUI && cell) cell.innerHTML = `<span class="badge" title="Compile error">ERR</span>`;
    console.error('Compile error for', f.name, err);
    return;
  }
  const badge = cell && cell.querySelector('.badge');
  const matches = await computeMatches(lastCSVRows, normalizedCSVRows, predicate, {
    chunk: 800,
    onProgress: (count) => {
      if (badge) badge.textContent = String(count);
    }
  });
  matchesCache.set(f.id, { count: matches.length, rows: matches });
  if (updateUI && cell) {
    cell.innerHTML = '';
    const a = document.createElement('a');
    a.href = '#';
    a.className = 'badge clickable';
    a.setAttribute('data-role', 'open-matches');
    a.setAttribute('data-id', f.id);
    a.textContent = String(matches.length);
    a.title = 'Click to view results';
    cell.appendChild(a);
  }
  if (openTable) {
    openResultTable(f.id);
  }
}

/* Attaches click handlers that open matching results for each file. */
function bindOpenMatches() {
  $$('#tbody [data-role="open-matches"]').forEach((a) => {
    // Remove old listeners to prevent duplicates
    a.replaceWith(a.cloneNode(true));
  });
  // Attach new listeners to the cloned elements
  $$('#tbody [data-role="open-matches"]').forEach((a) => {
    a.addEventListener('click', (e) => {
      e.preventDefault();
      const id = a.getAttribute('data-id');
      openResultTable(id);
    });
  });
}

/* Opens the results table below for the selected file. (MODIFIED) */
function openResultTable(fileId) {
  const rec = matchesCache.get(fileId);
  const f = fileById(fileId);
  const wrap = document.getElementById('resultWrap');
  if (!rec || !f) {
    wrap.innerHTML = `<output id="onNames" class="muted-sm">No results.</output>`;
    return;
  }
  const rows = rec.rows || [];
  const cols = [ // Add an empty column for the copy icon
    '',
    'Time', 'Source', 'Policies', 'Channel', 'Destination',
    'File Name', 'Details', 'Size', 'Status'
  ];
  const headerHTML = cols.map((h) => `<th>${escapeHtml(h)}</th>`).join('');
  const bodyHTML = rows
    .map((rRaw) => {
      const rc = normalizedRowByRaw.get(rRaw);
      const timeText = `ID ${safe(rc.ID)} | Incident ${safe(rc.IncidentTime)} | Event ${safe(rc.EventTime)}`;
      // Add `data-row-json` to <tr> to store raw data
      // Add a <td> with a copy button
      return `<tr data-row-json='${escapeHtml(JSON.stringify(rRaw))}'>
        <td><button class="icon-btn" title="Copy row data" data-act="copy-row">📋</button></td>
        <td title="${timeText}">${escapeHtml(timeText)}</td>
        <td title="${safe(rc.Source)}">${escapeHtml(safe(rc.Source))}</td>
        <td title="${safe(rc.Policies)}">${escapeHtml(safe(rc.Policies))}</td>
        <td title="${safe(rc.Channel)}">${escapeHtml(safe(rc.Channel))}</td>
        <td title="${safe(rc.Destination)}">${escapeHtml(safe(rc.Destination))}</td>
        <td title="${safe(rc.FileName)}">${escapeHtml(safe(rc.FileName))}</td>
        <td title="${safe(rc.Details)}">${escapeHtml(safe(rc.Details))}</td>
        <td title="${safe(rRaw['Transaction Size (KB)'] ?? rc.Size)}">${escapeHtml(safe(rRaw['Transaction Size (KB)'] ?? rc.Size))}</td>
        <td title="${safe(rc.Status)}">${escapeHtml(safe(rc.Status))}</td>
      </tr>`;
    })
    .join('');

  wrap.innerHTML = `
    <section class="section">
      <header>
        <strong>Results • ${escapeHtml(f.name)}</strong>
        <div class="right"><span class="muted-sm">${rows.length} matched rows</span></div>
      </header>
      <div style="overflow:auto">
        <table class="cols-10">
          <thead><tr>${headerHTML}</tr></thead>
          <tbody>${bodyHTML || `<tr><td colspan="${cols.length}" class="muted-sm">No rows matched.</td></tr>`}</tbody>
        </table>
      </div>
    </section>`;

  // (ADDED) Event listener that handles copy-button clicks through event delegation
  const table = wrap.querySelector('table');
  if (table) {
      table.addEventListener('click', (e) => {
          const button = e.target.closest('[data-act="copy-row"]');
          if (!button) return;

          const tr = button.closest('tr');
          if (!tr || !tr.dataset.rowJson) return;

          try {
              const rowData = JSON.parse(tr.dataset.rowJson);
              copyRowToClipboard(rowData, button);
          } catch (err) {
              console.error('Failed to parse row data for copying:', err);
          }
      });
  }
}

window.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
    e.preventDefault();
    saveCurrent();
  }
});

render();
const firstFile = files().sort((a, b) => a.name.localeCompare(b.name))[0];
if (firstFile) openEditor(firstFile.id);



/* =======================================================================================
$: Selects the first element matching a selector.
uid: Creates a short random ID for a file item.
load: Loads the item list from localStorage.
save: Saves the item list to localStorage.
migrate: Migrates legacy data (v2) to the new format when the v3 key does not exist.
files: Returns all items of type 'file'.
fileById: Finds a file by ID, or returns null when none exists
applyFilter: Applies text search to filenames and file contents.
getRowCell: Gets the cell in a given file row for a specified class.
parseCSVFile: Reads one CSV File and returns rows as an object array.
parseCSV: Parses CSV text into an object array (automatically detects the delimiter).
detectDelimiter: Detects the best CSV delimiter from sample rows (comma, semicolon, or tab).
countDelimOutsideQuotes: Counts delimiters outside quotes in one row.
splitCSVLine: Splits one CSV row into cells while respecting quotes.
secureCompilePredicate: Compiles a JS predicate safely (restricts dangerous global access).
normalizeFileList: Normalizes a filename list into a '; '-separated format.
ensureCamelRow: Converts a row into a consistent camelCase version for processing.
computeMatches: Evaluates a predicate in batches to keep the UI responsive; returns matching rows.
render: Renders the file list in the left table and attaches row event handlers.
newFile: Creates a new empty file and opens it in the editor.
openEditor: Opens the editor for a given file ID and populates the editor fields.
saveCurrent: Saves changes to the currently open file.
deleteFile: Deletes a file by ID after confirmation, then rerenders.
clearEditor: Resets the editor view to an empty state.
exportJSON: Exports all files to JSON and downloads the result.
importJSON: Imports files from JSON (merge/replace by name), then renders.
setToggle: Sets the ON/OFF toggle and optionally saves it to the active item.
getToggleBoolean: Returns the toggle state as a boolean.
getToggleName: Returns the toggle-state name ('ON'|'OFF').
runOneFileInternal: Runs one snippet file against the CSV dataset, updates the UI, and optionally opens the results table.
bindOpenMatches: Attaches click handlers that open matching results for each file.
openResultTable: Opens the results table below for the selected file.
escapeHtml: Converts special characters to safe HTML entities. (defined twice in this snippet)
safe: Converts a value to a display-safe string. (defined twice in this snippet)
======================================================================================= */

</script>
